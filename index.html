<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bioprinter Tools</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap">
<style>
  :root {
    /* night palette — slate surfaces, pastel blue / green / orange */
    --bg: #11141b; --surface: #171b24; --surface2: #1d222d;
    --border: #272d3a; --border2: #343c4e;
    --accent: #8fb3e6; --accent-dim: rgba(143,179,230,0.13);
    --accent-mid: #a8c5ee;
    --on-accent: #0f1522;
    --blue: #8fb3e6; --blue-dim: rgba(143,179,230,0.12);
    --green: #9ad1ab; --green-dim: rgba(154,209,171,0.14);
    --orange: #e9b98f; --orange-dim: rgba(233,185,143,0.14);
    --text: #dfe4ee; --text2: #a3aec2; --text3: #7b879d;
    --danger: #e89a9a;
    --sidebar-w: 240px;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Geist', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; }

  /* ── LAYOUT ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w); min-width: var(--sidebar-w);
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }

  #sidebar-top { padding: 18px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }

  .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .logo-icon {
    width: 26px; height: 26px; background: var(--accent); border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--on-accent); font-weight: 800; flex-shrink: 0;
  }
  .logo-text { font-size: 13px; font-weight: 700; color: var(--text); }
  .logo-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.05em; }

  #credit {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; color: var(--text3);
  }
  #credit a { color: var(--text2); text-decoration: none; transition: color 0.12s; }
  #credit a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }

  #nav { overflow-y: auto; flex: 1; padding: 8px 0 16px; }
  #nav::-webkit-scrollbar { width: 3px; }
  #nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .nav-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 18px; cursor: pointer;
  }
  .nav-thumb {
    width: 100%; aspect-ratio: 16 / 10; overflow: hidden;
    background: #000; border: 1px solid var(--border2); border-radius: 9px;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .nav-thumb img, .nav-thumb svg { display: block; width: 100%; height: 100%; }
  .nav-thumb img { object-fit: cover; }
  .nav-label { font-size: 11px; color: var(--text2); text-align: center; transition: color 0.12s; }
  .nav-item:hover .nav-thumb { border-color: var(--text3); }
  .nav-item:hover .nav-label { color: var(--text); }
  .nav-item.active .nav-thumb { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .nav-item.active .nav-label { color: var(--accent); font-weight: 600; }

  /* ── G-CODE SHORTCUTS (click to copy, paste into the Duet console) ── */
  #shortcuts { flex-shrink: 0; border-top: 1px solid var(--border); background: var(--surface); }
  #shortcuts summary {
    list-style: none; cursor: pointer; padding: 10px 18px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3);
  }
  #shortcuts summary::-webkit-details-marker { display: none; }
  #shortcuts summary::after { content: '▾'; transition: transform 0.15s; }
  #shortcuts:not([open]) summary::after { transform: rotate(-90deg); }
  #shortcuts summary:hover { color: var(--text2); }
  #shortcut-list { max-height: 42vh; overflow-y: auto; padding: 0 12px 12px; }
  #shortcut-list::-webkit-scrollbar { width: 3px; }
  #shortcut-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .sc-group { margin-top: 10px; }
  .sc-group:first-child { margin-top: 0; }
  .sc-title { font-size: 11px; font-weight: 600; color: var(--text2); padding: 0 6px 4px; }
  .sc-item {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; margin-bottom: 4px; cursor: pointer; text-align: left;
    font-family: inherit; color: inherit; transition: border-color 0.12s;
  }
  .sc-item:hover { border-color: var(--text3); }
  .sc-item.copied { border-color: var(--green); }
  .sc-desc { font-size: 10px; color: var(--text3); }
  .sc-item.copied .sc-desc { color: var(--green); }
  .sc-code { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent); user-select: all; }

  /* ── MAIN ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  #content-area { flex: 1; overflow-y: auto; }
  #content-area::-webkit-scrollbar { width: 5px; }
  #content-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* ── WELCOME ── */
  #welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 10px;
    color: var(--text3); text-align: center;
  }
  #welcome .welcome-icon {
    width: 48px; height: 48px; background: var(--accent); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: var(--on-accent); font-weight: 800; margin-bottom: 6px;
  }
  #welcome h2 { font-size: 20px; font-weight: 700; color: var(--text); }
  #welcome p { font-size: 13px; color: var(--text2); line-height: 1.6; }

  /* ── TOOL FRAME ── */
  #tool-frame { padding: 2.5rem 3rem; min-height: 100%; }

  /* ── STATES ── */
  #loading {
    display: none; align-items: center; justify-content: center;
    height: 100%; color: var(--text3);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.1em;
  }
  #loading.visible { display: flex; }

  #error-msg {
    display: none; align-items: center; justify-content: center;
    height: 100%; flex-direction: column; gap: 6px;
    color: var(--danger); font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  #error-msg .sub { font-size: 11px; color: var(--text3); }
  #error-msg.visible { display: flex; }
</style>
</head>
<body>
<div id="app">

  <aside id="sidebar">
    <div id="sidebar-top">
      <div class="logo">
        <div class="logo-icon">B</div>
        <div>
          <div class="logo-text">Bioprinter</div>
          <div class="logo-sub">tools</div>
        </div>
      </div>
      <div id="credit">
        Made by:<br>
        <a href="https://guilhermemartins.net" target="_blank" rel="noopener noreferrer">Guilherme Martins</a><br>
        @ <a href="https://biolablisboa.pt/" target="_blank" rel="noopener noreferrer">BioLab Lisboa</a>
      </div>
    </div>
    <nav id="nav"></nav>
    <details id="shortcuts" open>
      <summary>G-code shortcuts</summary>
      <div id="shortcut-list"></div>
    </details>
  </aside>

  <div id="main">
    <div id="content-area">
      <div id="loading">loading…</div>
      <div id="error-msg">
        <span>tool not found</span>
        <span class="sub">file missing or not yet built</span>
      </div>
      <div id="tool-frame">
        <div id="welcome">
          <div class="welcome-icon">B</div>
          <h2>Bioprinter Tools</h2>
          <p>Select a tool from the sidebar to get started.</p>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
  const TOOLS = [
    { label: 'Dot / Line Grid', file: 'tools/dot-grid.html',     icon: 'GRID_GCODE.jpg' },
    { label: 'Image → G-code',  file: 'tools/img-to-gcode.html', icon: 'IMG_GCODE.jpg' },
  ];

  // Same white-on-black line style as the icon files: a spiral, shown for tools without an icon image.
  const FALLBACK_ICON = `<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="160" height="100" fill="#000"/>
    <path d="M80 50 a4 4 0 0 1 8 0 a8 8 0 0 1 -16 0 a12 12 0 0 1 24 0 a16 16 0 0 1 -32 0 a20 20 0 0 1 40 0 a24 24 0 0 1 -48 0"
          fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;

  const nav         = document.getElementById('nav');
  const toolFrame   = document.getElementById('tool-frame');
  const loadingEl   = document.getElementById('loading');
  const errorEl     = document.getElementById('error-msg');

  // build sidebar
  TOOLS.forEach(tool => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.file  = tool.file;
    item.dataset.label = tool.label;
    const thumb = document.createElement('div');
    thumb.className = 'nav-thumb';
    if (tool.icon) {
      const img = document.createElement('img');
      img.src = tool.icon;
      img.alt = tool.label;
      img.onerror = () => { thumb.innerHTML = FALLBACK_ICON; };      // missing file: fall back
      thumb.appendChild(img);
    } else {
      thumb.innerHTML = FALLBACK_ICON;
    }
    const caption = document.createElement('span');
    caption.className = 'nav-label';
    caption.textContent = tool.label;
    item.append(thumb, caption);
    item.addEventListener('click', () => loadTool(item));
    nav.appendChild(item);
  });

  function setActive(item) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    item.classList.add('active');
  }

  function showLoading() {
    toolFrame.style.display  = 'none';
    errorEl.classList.remove('visible');
    loadingEl.classList.add('visible');
  }

  function showTool(html) {
    loadingEl.classList.remove('visible');
    errorEl.classList.remove('visible');
    toolFrame.style.display = '';
    toolFrame.innerHTML = html;
    toolFrame.querySelectorAll('script').forEach(old => {
      const s = document.createElement('script');
      for (const attr of old.attributes) s.setAttribute(attr.name, attr.value);   // keep src etc.
      s.async = false;                                                             // run in document order
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }

  function showError() {
    loadingEl.classList.remove('visible');
    toolFrame.style.display = 'none';
    errorEl.classList.add('visible');
  }

  async function loadTool(item) {
    setActive(item);
    showLoading();
    try {
      const res = await fetch(item.dataset.file, { cache: 'no-store' });   // always the current file, never a cached copy
      if (!res.ok) throw new Error(res.status);
      showTool(await res.text());
    } catch {
      showError();
    }
  }

  // G-code shortcuts: click copies the command, ready to paste into the Duet console
  const SHORTCUTS = [
    { group: 'Extruder', items: [
      ['Select tool',            'T0'],
      ['Extruder 2 mm down',     'G1 E2 F60'],
      ['Extruder 2 mm up',       'G1 E-2 F60'],
    ]},
    { group: 'BLTouch', items: [
      ['Deploy probe',           'M280 P0 S10'],
      ['Retract probe',          'M280 P0 S90'],
    ]},
    { group: 'Motors', items: [
      ['Disable motors',         'M84'],
    ]},
    { group: 'Flow rate', items: [
      ['Set flow to 90%',        'M221 S90'],
      ['Set flow to 110%',       'M221 S110'],
    ]},
  ];

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {}
    const ta = document.createElement('textarea');                 // fallback when the Clipboard API is unavailable
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    ta.remove();
    return ok;
  }

  const scList = document.getElementById('shortcut-list');
  SHORTCUTS.forEach(({ group, items }) => {
    const g = document.createElement('div');
    g.className = 'sc-group';
    const title = document.createElement('div');
    title.className = 'sc-title';
    title.textContent = group;
    g.appendChild(title);
    items.forEach(([desc, code]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'sc-item';
      b.title = 'Click to copy';
      const d = document.createElement('span'); d.className = 'sc-desc'; d.textContent = desc;
      const c = document.createElement('span'); c.className = 'sc-code'; c.textContent = code;
      b.append(d, c);
      b.addEventListener('click', async () => {
        const ok = await copyText(code);
        d.textContent = ok ? 'Copied ✓' : 'Copy failed';
        b.classList.toggle('copied', ok);
        setTimeout(() => { d.textContent = desc; b.classList.remove('copied'); }, 1200);
      });
      g.appendChild(b);
    });
    scList.appendChild(g);
  });

  const scBox = document.getElementById('shortcuts');
  try { if (localStorage.getItem('bioprinter.shortcuts.open') === '0') scBox.open = false; } catch {}
  scBox.addEventListener('toggle', () => { try { localStorage.setItem('bioprinter.shortcuts.open', scBox.open ? '1' : '0'); } catch {} });
</script>
</body>
</html>
