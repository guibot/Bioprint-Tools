<style>
  .tool { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 2rem; min-height: 100%; align-items: start; }
  .tool-params, #params { display: flex; flex-direction: column; gap: 1.25rem; }

  /* the parameter column scrolls on its own, so the preview stays in view */
  .tool-params {
    position: sticky; top: 2.5rem; align-self: start;
    max-height: calc(100vh - 5rem); overflow-y: auto; padding-right: 12px;
  }
  .tool-params > * { flex-shrink: 0; }                      /* never squash a block to fit the column height */
  .tool-params::-webkit-scrollbar { width: 3px; }
  .tool-params::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; }      /* only visible while the mouse is over the column */
  .tool-params:hover::-webkit-scrollbar-thumb { background: var(--border2); }
  @media (max-width: 960px) { .tool { grid-template-columns: 1fr; } .tool-params { position: static; max-height: none; overflow: visible; padding-right: 0; } }

  .param-group { display: flex; flex-direction: column; gap: 6px; }
  .param-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text3);
    padding-bottom: 0.4rem; margin-bottom: 2px;
    border-bottom: 1px solid var(--border);
  }

  .check.off { display: none; }
  .check { display: flex; align-items: center; gap: 8px; height: 28px; font-size: 13px; color: var(--text2); cursor: pointer; user-select: none; }
  .check input { accent-color: var(--accent); margin: 0; cursor: pointer; }

  /* slider-style numeric field: drag horizontally to set, click to type */
  .field {
    position: relative; display: flex; align-items: center; gap: 8px;
    height: 32px; padding: 0 10px;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 7px;
    overflow: hidden; cursor: ew-resize; user-select: none; touch-action: pan-y;
    transition: border-color 0.15s;
  }
  .field::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: calc(var(--fill, 0) * 100%);
    background: var(--accent-dim);
    pointer-events: none;
  }
  .field.off { display: none; }
  .field:hover { border-color: var(--border2); }
  .field.scrubbing, .field:focus-within { border-color: var(--accent); }
  .field:focus-within { cursor: text; user-select: auto; }
  .field.invalid { border-color: var(--danger); }
  .field.invalid::before { background: rgba(232,154,154,0.12); }

  .field label {
    position: relative; flex: 1; pointer-events: none;
    font-size: 13px; color: var(--text2); white-space: nowrap;
  }
  .field input {
    position: relative; width: 74px; padding: 0;
    background: transparent; border: none; outline: none;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text); text-align: right; cursor: inherit;
    -moz-appearance: textfield; appearance: textfield;
  }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field .unit {
    position: relative; width: 40px; pointer-events: none;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3);
  }

  /* output panel */
  .tool-output { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }

  .output-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  .btn {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2); border-radius: 7px;
    padding: 7px 14px; font-size: 13px;
    cursor: pointer; font-family: 'Geist', sans-serif;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--text3); color: var(--text); }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:disabled:hover { border-color: var(--border2); color: var(--text2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-mid); border-color: var(--accent-mid); color: var(--on-accent); }
  .btn.primary:disabled:hover { background: var(--accent); border-color: var(--accent); }

  .gcode-warning {
    order: 10; flex: 1 1 100%; min-width: 0; margin: 0;   /* own row below the buttons, so it never gets squeezed */
    padding: 5px 10px; border-radius: 7px;
    background: rgba(232,154,154,0.10); border: 1px solid rgba(232,154,154,0.35);
    color: var(--danger); font-size: 11px; line-height: 1.45;
  }
  .gcode-warning a { color: inherit; font-weight: 600; text-underline-offset: 2px; }

  .output-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text3); min-height: 1.4em;
    display: flex; flex-wrap: wrap; gap: 4px 14px;
  }
  .output-meta .warn  { color: var(--orange); }
  .output-meta .error { color: var(--danger); }

  /* tabs */
  .tabs { display: flex; align-items: flex-end; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 6px 14px; margin-bottom: -1px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text3); cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs .spacer { flex: 1; }

  .seg { display: inline-flex; margin-bottom: 4px; border: 1px solid var(--border2); border-radius: 6px; overflow: hidden; }
  .seg.hidden { display: none; }
  .seg.wide { display: flex; margin-bottom: 0; }
  .seg.wide button { flex: 1; padding: 7px 11px; font-size: 12px; }
  .seg.wide button.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .seg button {
    background: none; border: none; padding: 3px 11px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text3); cursor: pointer; transition: all 0.15s;
  }
  .seg button:hover { color: var(--text2); }
  .seg button.active { background: var(--accent-dim); color: var(--accent); }

  /* preview */
  .preview-wrap {
    display: none; flex-direction: column; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
  }
  .preview-wrap.active { display: flex; }
  canvas { display: block; }

  .legend {
    display: flex; gap: 16px; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .legend i.start  { background: var(--orange); }
  .legend i.outline { width: 14px; height: 3px; border-radius: 2px; background: var(--orange); }
  .legend i.purge  { background: var(--danger); }
  .legend i.dot    { background: var(--green); }
  .legend i.hline  { width: 14px; height: 3px; border-radius: 2px; background: var(--green); }
  .legend i.vline  { width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
  .legend i.travel { width: 14px; height: 2px; border-radius: 1px; background: var(--accent); opacity: 0.6; }

  /* gcode */
  .gcode-output {
    display: none; min-height: 420px; height: 60vh;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text2); line-height: 1.6;
    resize: none; outline: none; overflow-y: auto;
  }
  .gcode-output.active { display: block; }

  /* ghosts: earlier experiments on the same tray (shared by all tools) */
  .preview-wrap { position: relative; }
  .param-group-label.with-actions { display: flex; align-items: center; justify-content: space-between; }
  .ghost-actions { display: flex; gap: 4px; }
  .ghost-btn {
    background: none; border: 1px solid var(--border2); border-radius: 5px;
    padding: 1px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; color: var(--text3); cursor: pointer; transition: all 0.15s;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--text3); }
  .ghost-card {
    position: absolute; z-index: 5; width: 230px; pointer-events: none;
    background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px;
    padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.45);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text2);
  }
  .ghost-card header { margin-bottom: 2px; color: var(--text); font-weight: 600; }
  .ghost-card .sub { color: var(--text3); font-size: 10px; margin-bottom: 8px; }
  .ghost-card dl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 0; }
  .ghost-card dt { color: var(--text3); }
  .ghost-card dd { margin: 0; text-align: right; color: var(--text); }
</style>

<div class="tool">

  <div class="tool-params">
    <div class="seg wide" id="mode-seg">
      <button data-mode="dots">Dots</button>
      <button data-mode="lines">Lines</button>
    </div>
    <div id="params"></div>
  </div>

  <div class="tool-output">
    <div class="output-actions">
      <button class="btn primary" id="btn-download" disabled>Download .gcode</button>
      <button class="btn" id="btn-copy" disabled>Copy</button>
      <div class="gcode-warning" role="alert">
        Always check your G-code with a simulator: <a href="https://ncviewer.com/" target="_blank" rel="noopener noreferrer">https://ncviewer.com/</a><br>
        Provided as is, without warranty. You use it at your own risk; the authors are not liable for any damage or injury.
      </div>
      <button class="btn" id="btn-export" title="Save the current parameters as a .json file">Export settings</button>
      <button class="btn" id="btn-load" title="Load parameters from a .json file">Load settings</button>
      <input type="file" id="settings-file" accept=".json,application/json" hidden>
      <button class="btn" id="btn-reset" title="Restore default parameters">Reset</button>
    </div>
    <div class="output-meta" id="meta"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="preview">Preview</button>
      <button class="tab-btn"        data-tab="gcode">G-code</button>
      <span class="spacer"></span>
      <div class="seg" id="view-seg">
        <button data-view="bed" class="active">Work area</button>
        <button data-view="grid">Fit grid</button>
      </div>
    </div>

    <div class="preview-wrap active" id="tab-preview">
      <canvas id="canvas"></canvas>
      <div class="legend" id="legend"></div>
    </div>
    <textarea class="gcode-output" id="tab-gcode" readonly placeholder="G-code will appear here…"></textarea>
  </div>

</div>

<script>
(() => {
  const STORE_KEY = 'bioprinter.dotgrid.v1';
  const $     = id => document.getElementById(id);
  const val   = id => parseFloat($(id).value);
  const intVal = id => parseInt($(id).value, 10);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const css   = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // ── Standalone fallback ───────────────────────────────────────
  // Opened directly (not through index.html) the palette variables don't exist and
  // everything renders black on white. Mirror the index.html palette in that case only.
  if (!css('--bg')) {
    const s = document.createElement('style');
    s.textContent =
      ':root{--bg:#11141b;--surface:#171b24;--surface2:#1d222d;--border:#272d3a;--border2:#343c4e;' +
      '--accent:#8fb3e6;--accent-dim:rgba(143,179,230,0.13);--accent-mid:#a8c5ee;--on-accent:#0f1522;' +
      '--green:#9ad1ab;--orange:#e9b98f;--text:#dfe4ee;--text2:#a3aec2;--text3:#7b879d;--danger:#e89a9a}' +
      '*,*::before,*::after{box-sizing:border-box}' +
      'html,body{margin:0;background:var(--bg);color:var(--text);font:15px Geist,system-ui,sans-serif}' +
      'body{padding:2.5rem 3rem}';
    document.head.appendChild(s);
    const f = document.createElement('link');
    f.rel = 'stylesheet';
    f.href = 'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap';
    document.head.appendChild(f);
  }

  // ── Parameters ────────────────────────────────────────────────
  // min/max/step define the slider; typing can still go beyond max.
  //   modes : which print modes show the field (default both)
  //   labels: per-mode label override        min: number, or { dots, lines }
  //   ok/hint: validity rule (default: finite and ≥ 0)
  const pos  = { ok: v => v > 0,  hint: 'must be > 0' };
  const int1 = { ok: v => Number.isInteger(v) && v >= 1, hint: 'must be an integer ≥ 1' };
  const any  = { ok: () => true };
  const GROUPS = [
    { label: 'Work area', fields: [
      { id: 'bed_x', label: 'Bed X', unit: 'mm', value: 310, min: 50, max: 600, step: 5, ...pos },
      { id: 'bed_y', label: 'Bed Y', unit: 'mm', value: 220, min: 50, max: 600, step: 5, ...pos },
    ]},
    { label: 'Position', fields: [
      { id: 'origin_x', label: 'Origin X', unit: 'mm', value: 0, min: 0, max: () => val('bed_x'), step: 1, ...any },
      { id: 'origin_y', label: 'Origin Y', unit: 'mm', value: 0, min: 0, max: () => val('bed_y'), step: 1, ...any },
    ]},
    { label: 'Grid', fields: [
      { id: 'width',    label: 'Width',  unit: 'mm', value: 100, min: 1, max: () => val('bed_x'), step: 1, ...pos },
      { id: 'height',   label: 'Height', unit: 'mm', value: 100, min: 1, max: () => val('bed_y'), step: 1, ...pos },
      { id: 'points_x', label: 'Points X', labels: { lines: 'Vertical lines' },   unit: '', value: 5, min: { dots: 2, lines: 1 }, max: 50, step: 1,
        ok: v => Number.isInteger(v) && v >= fieldMin(FIELD.points_x) && v <= 500, hint: () => `must be an integer from ${fieldMin(FIELD.points_x)} to 500` },
      { id: 'points_y', label: 'Points Y', labels: { lines: 'Horizontal lines' }, unit: '', value: 5, min: { dots: 2, lines: 1 }, max: 50, step: 1,
        ok: v => Number.isInteger(v) && v >= fieldMin(FIELD.points_y) && v <= 500, hint: () => `must be an integer from ${fieldMin(FIELD.points_y)} to 500` },
      { modes: ['lines'], id: 'angle', label: 'Rotate lines', unit: '°', value: 0, min: -90, max: 90, step: 1, ...any },
    ]},
    { label: 'Pre-extrude', fields: [
      { id: 'pre_z',     label: 'Raise Z to',        unit: 'mm',     value: 20, min: 10, max: 60, step: 1,
        ok: v => v >= 10, hint: 'must be ≥ 10' },
      { id: 'pre_x',     label: 'Purge X',           unit: 'mm',     value: 10, min: 0,  max: () => val('bed_x'), step: 1, ...any },
      { id: 'pre_y',     label: 'Purge Y',           unit: 'mm',     value: 210, min: 0,  max: () => val('bed_y'), step: 1, ...any },
      { id: 'pre_travel_speed', label: 'Purge travel speed', unit: 'mm/min', value: 800, min: 60, max: 6000, step: 20, ...pos },
      { id: 'pre_len',   label: 'Pre-extrude',       unit: 'mm',     value: 1,   min: 0, max: 20,  step: 0.1 },
      { id: 'pre_flow',  label: 'Pre-extrude flow',  unit: '%',      value: 25, min: 0, max: 500, step: 5 },
      { id: 'pre_pause', label: 'Pre-extrude pause', unit: 'ms',     value: 1000, min: 0, max: 10000, step: 100 },
      { id: 'pre_wipe_z',     label: 'Wipe Z',         unit: 'mm',     value: 2,   min: 0,  max: 30,  step: 0.1 },
      { id: 'pre_wipe_len',   label: 'Wipe length (+X)', unit: 'mm',   value: 5,   min: 0,  max: 30,  step: 0.5 },
      { id: 'pre_wipe_speed', label: 'Wipe speed',     unit: 'mm/min', value: 60,  min: 5,  max: 600, step: 5, ...pos },
      { id: 'pre_lift_z',     label: 'Lift Z after',   unit: 'mm',     value: 30,  min: 0,  max: 100, step: 1,
        ok: v => v >= val('pre_z'), hint: 'must be ≥ Raise Z to' },
      { id: 'pre_lift_speed', label: 'Lift speed',     unit: 'mm/min', value: 400, min: 60, max: 3000, step: 20, ...pos },
    ]},
    { label: 'Print', fields: [
      // dots
      { modes: ['dots'], id: 'print_height',  label: 'Print height',          unit: 'mm',     value: 0.2,   min: 0,  max: 3,     step: 0.05 },
      { modes: ['dots'], id: 'z_hop',         label: 'Z hop',                 unit: 'mm',     value: 5.0,   min: 0,  max: 30,    step: 0.5 },
      { modes: ['dots'], id: 'flow_rate',     label: 'Extrusion per dot (E)', unit: '',       value: 0.022, min: 0,  max: 0.2,   step: 0.001 },
      { modes: ['dots'], id: 'travel_speed',  label: 'Travel speed',          unit: 'mm/min', value: 600,   min: 60, max: 6000,  step: 10, ...pos },
      { modes: ['dots'], id: 'extrude_speed', label: 'Extrude speed',         unit: 'mm/min', value: 20,    min: 5,  max: 200,   step: 5,  ...pos },
      { modes: ['dots'], id: 'pause_before_ms', label: 'Pause before extrude', unit: 'ms',     value: 500,   min: 0,  max: 10000, step: 100 },
      { modes: ['dots'], id: 'pause_time_ms', label: 'Pause after extrude',   unit: 'ms',     value: 500,   min: 0,  max: 10000, step: 100 },
      // lines
      { modes: ['lines'], id: 'layer_h',      label: 'Layer height',          unit: 'mm',     value: 0.6,   min: 0.05, max: 2,   step: 0.05, ...pos },
      { modes: ['lines'], id: 'n_layers',     label: 'Layers',                unit: '',       value: 1,     min: 1,  max: 20,    step: 1,  ...int1 },
      { modes: ['lines'], id: 'speed_print',  label: 'Print speed',           unit: 'mm/min', value: 400,   min: 60, max: 3000,  step: 60, ...pos },
      { modes: ['lines'], id: 'speed_travel', label: 'Travel speed',          unit: 'mm/min', value: 800,   min: 600, max: 9000, step: 60, ...pos },
      { modes: ['lines'], id: 'line_width',   label: 'Line width',            unit: 'mm',     value: 0.2,   min: 0.05, max: 2,   step: 0.05, ...pos },
      { modes: ['lines'], id: 'flow',         label: 'Flow',                  unit: '%',      value: 40,    min: 1,  max: 200,   step: 1 },
      { modes: ['lines'], id: 'temp',         label: 'Temperature',           unit: '°C',     value: 280,   min: 0,  max: 400,   step: 1 },
      { modes: ['lines'], id: 'travel_z',     label: 'Travel Z',              unit: 'mm',     value: 2,     min: 0,  max: 20,    step: 0.1 },
    ]},
    { label: 'Retract', fields: [
      { id: 'retract',       label: 'Retract',       unit: 'mm',     value: 0,  min: 0,  max: 1,   step: 0.01 },
      { id: 'retract_speed', label: 'Retract speed', unit: 'mm/min', value: 60, min: 5,  max: 600, step: 5, ...pos },
    ]},
    { label: 'End', fields: [
      { id: 'final_z',     label: 'Final Z',     unit: 'mm',     value: 30,   min: 0,  max: 100,  step: 1 },
      { id: 'final_speed', label: 'Final speed', unit: 'mm/min', value: 600, min: 60, max: 6000, step: 60, ...pos },
    ]},
  ];
  const FIELDS = GROUPS.flatMap(g => g.fields);
  const FIELD  = Object.fromEntries(FIELDS.map(f => [f.id, f]));
  FIELDS.forEach(f => { f.modes = f.modes || ['dots', 'lines']; });

  let mode = 'dots';                                   // 'dots' | 'lines'
  const fieldMin   = f => (typeof f.min === 'object' ? f.min[mode] : f.min);
  const fieldLabel = f => (f.labels && f.labels[mode]) || f.label;
  const active     = () => FIELDS.filter(f => f.modes.includes(mode));

  const decimals = step => { const s = String(step), i = s.indexOf('.'); return i < 0 ? 0 : s.length - i - 1; };
  const sliderMax = f => {
    const lo = fieldMin(f);
    const m  = typeof f.max === 'function' ? f.max() : f.max;
    return Number.isFinite(m) && m > lo ? m : lo + f.step;
  };

  // Purge settings (pre_on + every pre_* field) are shared with the other tools through localStorage
  // (keep this block in sync between tools).
  const PURGE_KEY = 'bioprinter.purge.v1';
  const readKey   = k => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch { return {}; } };
  function savePurge(o) {
    try {
      const p = {};
      Object.keys(o).forEach(k => { if (k === 'pre_on' || k.startsWith('pre_')) p[k] = o[k]; });
      localStorage.setItem(PURGE_KEY, JSON.stringify(p));
    } catch {}
  }
  function loadSaved() {
    const o = { ...readKey(STORE_KEY), ...readKey(PURGE_KEY) };
    if (o.final_speed === 1000) delete o.final_speed;   // old default → use the new one
    return o;
  }
  function saveParams() {
    try {
      const o = { mode };
      FIELDS.forEach(f => { o[f.id] = val(f.id); });
      o.pre_on = preOn();
      o.optimize = optOn();
      o.outline = outOn();
      localStorage.setItem(STORE_KEY, JSON.stringify(o));
      savePurge(o);
    } catch {}
  }
  const preOn  = () => !!$('pre_on') && $('pre_on').checked;
  const optOn  = () => !!$('optimize') && $('optimize').checked;
  const outOn  = () => !!$('outline') && $('outline').checked;
  const isPre  = f => f.id.startsWith('pre_');
  function applyPre() {                      // pre-extrude fields only show while the checkbox is on
    FIELDS.filter(isPre).forEach(f => $(f.id).parentElement.classList.toggle('off', !preOn()));
  }
  function clearSaved() { try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(PURGE_KEY); } catch {} }

  // ── Build the parameter fields ────────────────────────────────
  const paramsEl = $('params');

  function buildParams() {
    const saved = loadSaved();
    mode = saved.mode === 'lines' ? 'lines' : 'dots';
    paramsEl.textContent = '';
    GROUPS.forEach(g => {
      const group = document.createElement('div');
      group.className = 'param-group';
      const title = document.createElement('div');
      title.className = 'param-group-label';
      title.textContent = g.label;
      if (g.label === 'Position') { title.classList.add('with-actions'); title.innerHTML = '<span>Position</span>' + '<span class="ghost-actions"><button class="ghost-btn" id="btn-ghost" title="Keep the current print as a faint ghost on the preview">GHOST</button><button class="ghost-btn" id="btn-ghost-clear" title="Remove all ghosts">CLEAR</button></span>'; }
      group.appendChild(title);
      if (g.label === 'Print') {
        const c = document.createElement('label');
        c.className = 'check';
        c.id = 'optimize-row';
        c.innerHTML = `<input id="optimize" type="checkbox"${saved.optimize === false ? '' : ' checked'}> Optimize path (fewer lifts)`;
        group.appendChild(c);
        const o = document.createElement('label');
        o.className = 'check';
        o.id = 'outline-row';
        o.innerHTML = `<input id="outline" type="checkbox"${saved.outline === false ? '' : ' checked'}> Print the rectangle outline last`;
        group.appendChild(o);
      }
      if (g.label === 'Pre-extrude') {
        const c = document.createElement('label');
        c.className = 'check';
        c.innerHTML = `<input id="pre_on" type="checkbox"${saved.pre_on === false ? '' : ' checked'}> Pre-extrude before printing`;
        group.appendChild(c);
      }
      g.fields.forEach(f => {
        const v = Number.isFinite(saved[f.id]) ? saved[f.id] : f.value;
        const row = document.createElement('div');
        row.className = 'field';
        row.innerHTML =
          `<label for="${f.id}"></label>` +
          `<input id="${f.id}" type="number" value="${v}" step="${f.step}">` +
          `<span class="unit">${f.unit}</span>`;
        group.appendChild(row);
        enableScrub(row, f);
      });
      paramsEl.appendChild(group);
    });
    applyMode();
  }

  // Show the fields of the current mode, relabel shared ones, refresh legend
  function applyMode() {
    document.querySelectorAll('#mode-seg button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    FIELDS.forEach(f => {
      const row = $(f.id).parentElement;
      row.classList.toggle('off', !f.modes.includes(mode));
      row.querySelector('label').textContent = fieldLabel(f);
      $(f.id).min = fieldMin(f);
    });
    applyPre();
    $('optimize-row').classList.toggle('off', mode !== 'lines');
    $('outline-row').classList.toggle('off', mode !== 'lines');
    $('legend').innerHTML = mode === 'dots'
      ? '<span><i class="start"></i>start</span><span><i class="dot"></i>dot</span><span><i class="travel"></i>travel order</span><span><i class="purge"></i>pre-extrude</span>'
      : '<span><i class="start"></i>start</span><span><i class="hline"></i>horizontal</span><span><i class="vline"></i>vertical</span><span><i class="outline"></i>outline</span><span><i class="purge"></i>pre-extrude</span>';
    updateFields();
  }

  // Slider fill + reflow of ranges that depend on the work area
  function updateFields() {
    FIELDS.forEach(f => {
      const v = val(f.id), lo = fieldMin(f);
      const frac = Number.isFinite(v) ? clamp((v - lo) / (sliderMax(f) - lo), 0, 1) : 0;
      $(f.id).parentElement.style.setProperty('--fill', frac);
    });
  }

  // Drag across a field to set its value; a plain click focuses the input for typing.
  function enableScrub(row, f) {
    const input = row.querySelector('input');
    row.addEventListener('pointerdown', e => {
      if (e.button !== 0 || document.activeElement === input) return;
      e.preventDefault();
      const startX = e.clientX;
      let dragging = false;

      const onMove = ev => {
        if (!dragging) {
          if (Math.abs(ev.clientX - startX) < 4) return;
          dragging = true;
          row.classList.add('scrubbing');
          document.body.style.userSelect = 'none';
          document.body.style.cursor = 'ew-resize';
        }
        const r    = row.getBoundingClientRect();
        const frac = clamp((ev.clientX - r.left) / r.width, 0, 1);
        const lo   = fieldMin(f), max = sliderMax(f);
        const raw  = clamp(lo + frac * (max - lo), lo, max);
        const snapped = Math.round(raw / f.step) * f.step;
        input.value = +clamp(snapped, lo, max).toFixed(decimals(f.step));
        updateFields();
        generateSoon();
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        row.classList.remove('scrubbing');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        if (!dragging) { input.focus(); input.select(); }
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
      window.addEventListener('pointercancel', onUp);
    });
  }

  // ── Auto-generate ─────────────────────────────────────────────
  let rafId = 0, typeTimer = 0;
  function generateSoon() {            // while dragging: at most once per frame
    if (rafId) return;
    rafId = requestAnimationFrame(() => { rafId = 0; generate(); });
  }
  paramsEl.addEventListener('change', e => { if (e.target.id === 'pre_on') applyPre(); if (['pre_on', 'optimize', 'outline'].includes(e.target.id)) generate(); });
  paramsEl.addEventListener('input', () => {   // while typing: short debounce
    updateFields();
    clearTimeout(typeTimer);
    typeTimer = setTimeout(generate, 150);
  });

  // ── Validation ────────────────────────────────────────────────
  // Validates the fields of the current mode; returns an error message or null.
  function validate() {
    const errors = [];
    FIELDS.forEach(f => {
      const el = $(f.id);
      if (!f.modes.includes(mode) || (isPre(f) && !preOn())) { el.parentElement.classList.remove('invalid'); return; }
      const v  = parseFloat(el.value);
      const ok = f.ok || (x => x >= 0);
      const valid = Number.isFinite(v) && ok(v);
      el.parentElement.classList.toggle('invalid', !valid);
      if (!valid) {
        const hint = typeof f.hint === 'function' ? f.hint() : f.hint;
        errors.push(`${fieldLabel(f)} ${el.value === '' ? 'is required' : (hint || 'must be ≥ 0')}`);
      }
    });
    return errors.length ? errors.join(' · ') : null;
  }

  // ── Preview ───────────────────────────────────────────────────
  let last = null;        // last successfully generated grid
  let view = 'bed';       // 'bed' | 'grid'

  function niceStep(scale) {   // mm between axis lines, so they sit ≥ 48 px apart
    return [1, 2, 5, 10, 20, 25, 50, 100, 200, 500].find(s => s * scale >= 48) || 500;
  }

  function draw() {
    if (!last || !$('canvas').isConnected) return;
    const wrap = $('tab-preview');
    const availW = wrap.clientWidth - 24;
    if (availW <= 0) return;                           // preview tab hidden

    const { kind, bedX, bedY, width, height, ox, oy, px, py, lw } = last;
    const gx0 = ox, gx1 = ox + width, gy0 = oy, gy1 = oy + height;
    const outside = gx0 < 0 || gy0 < 0 || gx1 > bedX || gy1 > bedY;

    // viewport in mm
    let vx0, vy0, vx1, vy1;
    if (view === 'grid') {
      const m = Math.max(width, height) * 0.12;
      [vx0, vy0, vx1, vy1] = [gx0 - m, gy0 - m, gx1 + m, gy1 + m];
    } else {
      const x0 = Math.min(0, gx0), y0 = Math.min(0, gy0), x1 = Math.max(bedX, gx1), y1 = Math.max(bedY, gy1);
      const m  = Math.max(x1 - x0, y1 - y0) * 0.015;      // breathing room so edge dots aren't clipped
      [vx0, vy0, vx1, vy1] = [x0 - m, y0 - m, x1 + m, y1 + m];
    }
    const vw = vx1 - vx0, vh = vy1 - vy0;

    // canvas size: fit the viewport's aspect ratio into the available space
    const ml = 40, mr = 12, mt = 12, mb = 24;
    const maxH  = Math.max(320, window.innerHeight * 0.66);
    const plotW = Math.max(60, Math.min(availW - ml - mr, (maxH - mt - mb) * vw / vh));
    const plotH = plotW * vh / vw;
    const cssW  = plotW + ml + mr, cssH = plotH + mt + mb;
    const scale = plotW / vw;

    const canvas = $('canvas');
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width  = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width  = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const C = {
      bg: css('--bg'), surface2: css('--surface2'), border: css('--border'), border2: css('--border2'),
      text3: css('--text3'), accent: css('--accent'), green: css('--green'), orange: css('--orange'), danger: css('--danger'),
    };
    const mapX = x => ml + (x - vx0) * scale;
    const mapY = y => mt + plotH - (y - vy0) * scale;

    ctx.clearRect(0, 0, cssW, cssH);
    ctx.fillStyle = C.bg;
    ctx.fillRect(ml, mt, plotW, plotH);

    // bed (clipped to the plot area — in "Fit grid" it can extend past the viewport)
    const bx0 = mapX(0), bx1 = mapX(bedX), by0 = mapY(bedY), by1 = mapY(0);
    ctx.save();
    ctx.beginPath(); ctx.rect(ml, mt, plotW, plotH); ctx.clip();
    ctx.fillStyle = C.surface2;
    ctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);

    // axis lines (clipped to the bed)
    const step = niceStep(scale);
    ctx.save();
    ctx.beginPath(); ctx.rect(bx0, by0, bx1 - bx0, by1 - by0); ctx.clip();
    ctx.strokeStyle = C.border; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.ceil(vx0 / step) * step; x <= vx1; x += step) { const X = Math.round(mapX(x)) + 0.5; ctx.moveTo(X, mt); ctx.lineTo(X, mt + plotH); }
    for (let y = Math.ceil(vy0 / step) * step; y <= vy1; y += step) { const Y = Math.round(mapY(y)) + 0.5; ctx.moveTo(ml, Y); ctx.lineTo(ml + plotW, Y); }
    ctx.stroke();
    ctx.restore();
    ctx.restore();                                     // end of plot-area clip

    // tick labels
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillStyle = C.text3;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let x = Math.ceil(vx0 / step) * step; x <= vx1; x += step) ctx.fillText(String(x), mapX(x), mt + plotH + 6);
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let y = Math.ceil(vy0 / step) * step; y <= vy1; y += step) ctx.fillText(String(y), ml - 6, mapY(y));

    ctx.save();
    ctx.beginPath(); ctx.rect(ml, mt, plotW, plotH); ctx.clip();
    ctx.strokeStyle = C.border2;
    ctx.strokeRect(bx0 + 0.5, by0 + 0.5, bx1 - bx0 - 1, by1 - by0 - 1);
    ctx.restore();

    ghostTf = { ml, mt, plotH, scale, vx0, vy0 };
    ctx.save();
    ctx.beginPath(); ctx.rect(ml, mt, plotW, plotH); ctx.clip();
    drawGhosts(ctx, mapX, mapY, C);
    ctx.restore();

    // pre-extrude spot
    ctx.save();
    ctx.beginPath(); ctx.rect(ml, mt, plotW, plotH); ctx.clip();
    if (last.preOn) {
    ctx.strokeStyle = ctx.fillStyle = C.danger;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mapX(last.preX), mapY(last.preY), 6, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.fill();
    }
    ctx.restore();

    // grid bounding box
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = outside ? C.orange : C.accent;
    ctx.globalAlpha = outside ? 0.9 : 0.45;
    ctx.strokeRect(mapX(gx0), mapY(gy1), (gx1 - gx0) * scale, (gy1 - gy0) * scale);
    ctx.restore();

    const dx = px > 1 ? width / (px - 1) : 0, dy = py > 1 ? height / (py - 1) : 0;

    if (kind === 'lines') {
      // horizontal lines (green), then vertical (blue) — same order as the G-code
      const segs = gridSegments(ox, oy, width, height, py, px, last.angle);
      ctx.lineWidth = clamp(lw * scale, 1.5, 5);
      ctx.lineCap = 'round';
      [[segs.h, C.green], [segs.v, C.accent]].forEach(([list, colour]) => {
        ctx.strokeStyle = colour;
        ctx.beginPath();
        list.forEach(g => { ctx.moveTo(mapX(g.x1), mapY(g.y1)); ctx.lineTo(mapX(g.x2), mapY(g.y2)); });
        ctx.stroke();
      });
      if (last.outline) {                               // printed last: the rectangle itself
        ctx.strokeStyle = C.orange; ctx.lineWidth = clamp(lw * scale, 1.5, 5);
        ctx.strokeRect(mapX(gx0), mapY(gy1), (gx1 - gx0) * scale, (gy1 - gy0) * scale);
      }
      ctx.fillStyle = C.orange;
      ctx.beginPath(); ctx.arc(mapX(ox), mapY(oy), 4.5, 0, Math.PI * 2); ctx.fill();
      return;
    }

    // dots: travel order + dots
    ctx.strokeStyle = C.accent; ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let j = 0; j < py; j++) for (let i = 0; i < px; i++) {
      const X = mapX(ox + i * dx), Y = mapY(oy + j * dy);
      if (i === 0 && j === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    const r = clamp(Math.min(dx, dy) * scale * 0.3, 2.5, 6);
    ctx.fillStyle = C.green;
    for (let j = 0; j < py; j++) for (let i = 0; i < px; i++) {
      if (i === 0 && j === 0) continue;
      ctx.beginPath(); ctx.arc(mapX(ox + i * dx), mapY(oy + j * dy), r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = C.orange;
    ctx.beginPath(); ctx.arc(mapX(ox), mapY(oy), r + 1, 0, Math.PI * 2); ctx.fill();
  }


  // ── Ghosts ────────────────────────────────────────────────────
  // Earlier experiments on the same tray, drawn faintly under the current print. They describe the
  // physical tray, so every tool shares them through localStorage (keep this block in sync between tools).
  const GHOST_KEY = 'bioprinter.ghosts.v1', GHOST_MAX_COORDS = 40000;
  const loadGhosts = () => { try { const a = JSON.parse(localStorage.getItem(GHOST_KEY)); return Array.isArray(a) ? a : []; } catch { return []; } };
  const saveGhosts = () => { try { localStorage.setItem(GHOST_KEY, JSON.stringify(ghosts)); } catch {} };
  let ghosts = loadGhosts();
  let ghostTf = null;                                  // set by draw(): preview px ↔ mm, for clicking a ghost

  // box: [x0, y0, x1, y1] · dots: [[x, y]…] · paths: [[x, y, x, y…]…] (all mm) · params: [[label, value]…]
  function addGhost(mode, box, dots, paths, params) {
    const r2 = v => Math.round(v * 100) / 100;
    dots  = dots.map(p => [r2(p[0]), r2(p[1])]);
    paths = paths.map(p => p.map(r2));
    let simplified = false;
    if (dots.length * 2 + paths.reduce((n, p) => n + p.length, 0) > GHOST_MAX_COORDS) { dots = []; paths = []; simplified = true; }
    const n = ghosts.reduce((m, g) => Math.max(m, g.n), 0) + 1;
    ghosts.push({ n, tool: 'Dot / Line Grid', mode, ts: Date.now(), box: box.map(r2), dots, paths, params, simplified });
    saveGhosts();
    hideGhostCard();
    draw();
  }

  function clearGhosts() {
    ghosts = [];
    saveGhosts();
    hideGhostCard();
    draw();
  }

  function drawGhosts(ctx, mapX, mapY, C) {
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ghosts.forEach(g => {
      const [x0, y0, x1, y1] = g.box;
      ctx.strokeStyle = ctx.fillStyle = C.text3;
      ctx.globalAlpha = 0.55;
      ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.strokeRect(mapX(x0), mapY(y1), mapX(x1) - mapX(x0), mapY(y0) - mapY(y1));
      ctx.setLineDash([]);
      ctx.beginPath();
      g.paths.forEach(p => {
        ctx.moveTo(mapX(p[0]), mapY(p[1]));
        for (let k = 2; k < p.length; k += 2) ctx.lineTo(mapX(p[k]), mapY(p[k + 1]));
      });
      ctx.lineWidth = 1.5; ctx.stroke();
      g.dots.forEach(p => { ctx.beginPath(); ctx.arc(mapX(p[0]), mapY(p[1]), 2.2, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 0.9;
      ctx.fillText('#' + g.n, mapX(x0) + 3, mapY(y1) + 3);
      ctx.globalAlpha = 1;
    });
  }

  function hideGhostCard() {
    cardGhost = null;
    const c = document.querySelector('.ghost-card');
    if (c) c.remove();
  }

  // Hovering a ghost in the preview shows a floating card with the parameters it was made with.
  let cardGhost = null;
  function onCanvasMove(e) {
    const canvas = e.currentTarget;
    const rect = canvas.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    let g = null;
    if (ghostTf && ghosts.length) {
      const { ml, mt, plotH, scale, vx0, vy0 } = ghostTf;
      const x = vx0 + (cx - ml) / scale, y = vy0 + (mt + plotH - cy) / scale;
      g = [...ghosts].reverse().find(g => x >= g.box[0] && x <= g.box[2] && y >= g.box[1] && y <= g.box[3]) || null;
    }
    if (!g) { hideGhostCard(); return; }

    const wrap = canvas.closest('.preview-wrap');
    let card = wrap.querySelector('.ghost-card');
    if (!card || cardGhost !== g.n) {
      hideGhostCard();
      cardGhost = g.n;
      card = document.createElement('div');
      card.className = 'ghost-card';
      const head = document.createElement('header');
      head.textContent = 'Ghost #' + g.n;
      const sub = document.createElement('div');
      sub.className = 'sub';
      const d = new Date(g.ts), pad = v => String(v).padStart(2, '0');
      sub.textContent = `${g.tool} · ${g.mode} · ${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`
        + (g.simplified ? ' · outline only (too many points)' : '');
      const dl = document.createElement('dl');
      (g.params || []).forEach(([k, v]) => {
        const dt = document.createElement('dt'), dd = document.createElement('dd');
        dt.textContent = k; dd.textContent = v;
        dl.append(dt, dd);
      });
      card.append(head, sub, dl);
      wrap.appendChild(card);
    }
    const wr = wrap.getBoundingClientRect();
    let left = rect.left - wr.left + cx + 14, top = rect.top - wr.top + cy + 14;
    if (left + card.offsetWidth > wrap.clientWidth) left = Math.max(0, rect.left - wr.left + cx - card.offsetWidth - 14);
    if (top + card.offsetHeight > wrap.clientHeight) top = Math.max(0, wrap.clientHeight - card.offsetHeight - 4);
    card.style.left = left + 'px'; card.style.top = top + 'px';
  }

  function ghostFromCurrent() {
    if (!last) return;
    const { kind, ox, oy, width, height, px, py } = last;
    const dots = [], paths = [];
    if (kind === 'lines') {
      const segs = gridSegments(ox, oy, width, height, py, px, last.angle);
      [...segs.h, ...segs.v].forEach(g => paths.push([g.x1, g.y1, g.x2, g.y2]));
      if (last.outline) paths.push([ox, oy, ox + width, oy, ox + width, oy + height, ox, oy + height, ox, oy]);
    } else {
      const dx = px > 1 ? width / (px - 1) : 0, dy = py > 1 ? height / (py - 1) : 0;
      for (let j = 0; j < py; j++) for (let i = 0; i < px; i++) dots.push([ox + i * dx, oy + j * dy]);
    }
    const params = FIELDS.filter(f => f.modes.includes(mode) && !isPre(f) && f.id !== 'bed_x' && f.id !== 'bed_y')
      .map(f => [fieldLabel(f), `${val(f.id)}${f.unit ? ' ' + f.unit : ''}`]);
    addGhost(mode, [ox, oy, ox + width, oy + height], dots, paths, params);
  }

  // ── G-code ────────────────────────────────────────────────────
  // Retract: pull the plunger back by `ret` mm before every dwell or Z lift that follows extrusion
  // (which includes the lift after the pre-extrude and the final lift at the end), and push it
  // back just before extrusion resumes. Works on the finished G-code, tracking the absolute E.
  function applyRetract(lines, ret, speed) {
    if (!(ret > 0)) return lines;
    const out = [];
    let E = 0, z = null, retracted = false, extruded = false;
    for (const raw of lines) {
      const code = raw.split(';')[0];
      const em = /(?:^|\s)E(-?\d*\.?\d+)/.exec(code);
      if (/^\s*G92\b/.test(code)) { if (em) E = parseFloat(em[1]); out.push(raw); continue; }
      const move = /^\s*G[01]\b/.test(code);
      if (move && em) {
        if (retracted) { out.push(`G1 E${(E + ret).toFixed(5)} F${speed} ; unretract`); retracted = false; }
        E = parseFloat(em[1]); extruded = true;
        out.push(raw); continue;
      }
      if (/^\s*G4\b/.test(code) && extruded && !retracted) {   // dwell after extrusion: retract first, then wait
        E -= ret; retracted = true;
        out.push(`G1 E${E.toFixed(5)} F${speed} ; retract ${ret} mm`);
      }
      const zm = move && /\bZ(-?\d*\.?\d+)/.exec(code);
      if (zm) {
        const nz = parseFloat(zm[1]);
        if (z !== null && nz > z && extruded && !retracted) {
          E -= ret; retracted = true;
          out.push(`G1 E${E.toFixed(5)} F${speed} ; retract ${ret} mm`);
        }
        z = nz;
      }
      out.push(raw);
    }
    return out;
  }

  // Raise Z, go to the purge spot, extrude pre_len mm scaled by pre_flow %, then wait pre_pause ms. Returns the E total afterwards.
  // Afterwards lifts Z slowly and travels to the grid origin (startX, startY).
  function preExtrude(lines, travelSpeed, startX, startY) {
    if (!preOn()) return 0;
    const z = val('pre_z'), x = val('pre_x'), y = val('pre_y'), len = val('pre_len') * val('pre_flow') / 100;
    const sp = mode === 'dots' ? intVal('extrude_speed') : 20;   // lines mode has no extrude speed
    lines.push('; Pre-extrude');
    const ps = intVal('pre_travel_speed');
    lines.push(`G1 Z${z.toFixed(2)} F${ps}`);
    lines.push(`G1 X${x.toFixed(3)} Y${y.toFixed(3)} F${ps}`);
    if (val('pre_wipe_len') > 0) {   // lower to wipe height, then extrude while moving sideways
      lines.push(`G1 Z${val('pre_wipe_z').toFixed(2)} F${intVal('pre_lift_speed')} ; lower to wipe height`);
      lines.push(`G1 X${(x + val('pre_wipe_len')).toFixed(3)}${len > 0 ? ` E${len.toFixed(5)}` : ''} F${intVal('pre_wipe_speed')} ; purge ${val('pre_len')} mm at ${val('pre_flow')}% while moving ${val('pre_wipe_len')} mm`);
    } else if (len > 0) {
      lines.push(`G1 E${len.toFixed(5)} F${sp} ; pre-extrude ${val('pre_len')} mm at ${val('pre_flow')}%`);
    }
    if (len > 0 && val('pre_pause') > 0) lines.push(`G4 P${intVal('pre_pause')} ; wait ${intVal('pre_pause')}ms`);
    lines.push(`G1 Z${val('pre_lift_z').toFixed(2)} F${intVal('pre_lift_speed')} ; lift Z`);
    lines.push(`G1 X${startX.toFixed(3)} Y${startY.toFixed(3)} F${travelSpeed} ; travel to origin`);
    return len;
  }

  // Each builder reads its own inputs and returns { lines, info, geom, filename }.
  function buildDots() {
    const width        = val('width');
    const height       = val('height');
    const points_x     = intVal('points_x');
    const points_y     = intVal('points_y');
    const print_height = val('print_height');
    const z_hop        = val('z_hop');
    const flow_rate    = val('flow_rate');
    const travel_speed = intVal('travel_speed');
    const extrude_speed= intVal('extrude_speed');
    const origin_x     = val('origin_x');
    const origin_y     = val('origin_y');
    const pause_ms     = intVal('pause_time_ms');
    const pause_pre_ms = intVal('pause_before_ms');

    const spacing_x = points_x > 1 ? width  / (points_x - 1) : 0;
    const spacing_y = points_y > 1 ? height / (points_y - 1) : 0;

    const lines = [];
    lines.push('; Generated dot matrix G-code');
    lines.push('G90 ; absolute positioning');
    lines.push('M82 ; absolute extrusion mode');
    lines.push('G21 ; use mm');
    lines.push('G28 ; home all axes');
    lines.push('T0 ; select tool 0 - extrusor');
    let e_total = preExtrude(lines, travel_speed, origin_x, origin_y);
    lines.push(`G1 Z${z_hop.toFixed(2)} F${travel_speed}`);

    for (let j = 0; j < points_y; j++) {
      for (let i = 0; i < points_x; i++) {
        const x = +(origin_x + Math.round(i * spacing_x * 1000) / 1000).toFixed(3);
        const y = +(origin_y + Math.round(j * spacing_y * 1000) / 1000).toFixed(3);
        lines.push(`; Point (${i + 1}, ${j + 1})`);
        // travel → down → wait → extrude → (retract added by applyRetract) → wait → up
        lines.push(`G1 X${x.toFixed(3)} Y${y.toFixed(3)} F${travel_speed}`);
        lines.push(`G1 Z${print_height.toFixed(2)} F${travel_speed}`);
        if (pause_pre_ms > 0) lines.push(`G4 P${pause_pre_ms} ; wait ${pause_pre_ms}ms`);
        e_total += flow_rate;
        lines.push(`G1 E${e_total.toFixed(5)} F${extrude_speed}`);
        if (pause_ms > 0) lines.push(`G4 P${pause_ms} ; wait ${pause_ms}ms`);
        lines.push(`G1 Z${z_hop.toFixed(2)} F${travel_speed}`);
      }
    }
    lines.push('; End of print');
    lines.push(`G1 Z${val('final_z').toFixed(2)} F${intVal('final_speed')} ; move Z to final height`);
    if (preOn()) lines.push(`G1 X${val('pre_x').toFixed(3)} Y${val('pre_y').toFixed(3)} F${intVal('pre_travel_speed')} ; go to purge position`);
    lines.push('M104 S0 ; turn off hotend');
    lines.push('M140 S0 ; turn off bed');
    lines.push('M84 ; disable motors');

    return {
      lines,
      info: [`${points_x * points_y} dots · ${points_x} × ${points_y} · ${lines.length} lines`,
             `pitch ${spacing_x.toFixed(2)} × ${spacing_y.toFixed(2)} mm`],
      geom: { kind: 'dots', width, height, ox: origin_x, oy: origin_y, px: points_x, py: points_y },
      filename: 'dot-grid.gcode',
    };
  }

  // The line grid of the rectangle (x0,y0,width,height), rotated by `angle` degrees around the
  // rectangle's centre and clipped to the rectangle. Line spacing and anchor are those of the
  // unrotated grid, and enough lines are added to cover the whole rectangle at any angle.
  // Returns { h, v }: lists of segments { x1, y1, x2, y2, t0, t1, c } where c is the line's
  // position in the rotated frame and t0..t1 its extent along the line in that frame.
  function gridSegments(x0, y0, width, height, nH, nV, angle) {
    const cx = x0 + width / 2, cy = y0 + height / 2;
    const th = angle * Math.PI / 180, co = Math.cos(th), si = Math.sin(th);
    const reach = Math.hypot(width, height) / 2 + 1e-6;
    const spH = nH > 1 ? height / (nH - 1) : 0, spV = nV > 1 ? width / (nV - 1) : 0;
    const offsets = (first, sp) => {                    // positions first + k·sp that can touch the rectangle
      if (!(sp > 0)) return [first];
      const out = [];
      for (let k = Math.ceil((-reach - first) / sp); first + k * sp <= reach; k++) out.push(first + k * sp);
      return out;
    };
    const eps = 1e-6;
    const clip = (u, v, du, dv) => {                    // point (u,v) + t·(du,dv) in the rotated frame
      const X0 = u * co - v * si, Y0 = u * si + v * co, dx = du * co - dv * si, dy = du * si + dv * co;
      let t0 = -Infinity, t1 = Infinity;
      for (const [p, d, half] of [[X0, dx, width / 2], [Y0, dy, height / 2]]) {
        if (Math.abs(d) < 1e-12) { if (Math.abs(p) > half + eps) return null; continue; }
        const a = (-half - p) / d, b = (half - p) / d;
        t0 = Math.max(t0, Math.min(a, b)); t1 = Math.min(t1, Math.max(a, b));
      }
      if (t1 - t0 < 1e-6) return null;
      return { x1: cx + X0 + t0 * dx, y1: cy + Y0 + t0 * dy, x2: cx + X0 + t1 * dx, y2: cy + Y0 + t1 * dy, t0, t1 };
    };
    const h = [], v = [];
    offsets(-height / 2, spH).forEach(c => { const g = clip(0, c, 1, 0); if (g) h.push({ ...g, c }); });
    offsets(-width / 2,  spV).forEach(c => { const g = clip(c, 0, 0, 1); if (g) v.push({ ...g, c }); });
    return { h, v };
  }

  // The rectangle's own outline (width × height), as trails. Edges already covered by a grid
  // line (angle 0° / 90°) are skipped so nothing is printed twice. Starts at the corner nearest the pen.
  function outlineTrails(segs, x0, y0, width, height, penX, penY) {
    const corners = [[x0, y0], [x0 + width, y0], [x0 + width, y0 + height], [x0, y0 + height]];
    const on = (p, g) => {                              // is p on segment g?
      const dx = g.x2 - g.x1, dy = g.y2 - g.y1, l = Math.hypot(dx, dy);
      const t = ((p[0] - g.x1) * dx + (p[1] - g.y1) * dy) / (l * l);
      const px = g.x1 + t * dx, py = g.y1 + t * dy;
      return t > -1e-6 && t < 1 + 1e-6 && Math.hypot(p[0] - px, p[1] - py) < 1e-4;
    };
    const all = [...segs.h, ...segs.v];
    const covered = corners.map((a, i) => { const b = corners[(i + 1) % 4]; return all.some(g => on(a, g) && on(b, g)); });
    if (!covered.some(Boolean)) {
      let k = 0;
      corners.forEach((c, i) => { if (Math.hypot(c[0] - penX, c[1] - penY) < Math.hypot(corners[k][0] - penX, corners[k][1] - penY)) k = i; });
      return [[0, 1, 2, 3, 4].map(i => corners[(k + i) % 4])];
    }
    const trails = [];
    const c0 = covered.indexOf(true);
    let chain = null;
    for (let n = 1; n <= 4; n++) {                      // walk the edges after a covered one, chaining the free ones
      const i = (c0 + n) % 4;
      if (covered[i]) { chain = null; continue; }
      if (!chain) { chain = [corners[i]]; trails.push(chain); }
      chain.push(corners[(i + 1) % 4]);
    }
    return trails;
  }

  // Walks the grid in as few strokes (= pen lifts) as possible: the lines are split at their
  // crossings, then walked in greedy trails that start at odd-degree crossings and go straight
  // on whenever possible. Returns trails as lists of [x, y] corners.
  function gridTrails(segs, penX, penY) {
    const nodes = new Map();                            // rounded coordinates -> node index
    const pts = [], adj = [], edges = [];
    const node = (x, y) => {
      const k = Math.round(x * 1000) + ',' + Math.round(y * 1000);
      if (!nodes.has(k)) { nodes.set(k, pts.length); pts.push([x, y]); adj.push([]); }
      return nodes.get(k);
    };
    const world = (g, t) => { const f = (t - g.t0) / (g.t1 - g.t0); return [g.x1 + (g.x2 - g.x1) * f, g.y1 + (g.y2 - g.y1) * f]; };
    const eps = 1e-6;
    const split = (g, others) => {                      // crossings of g with the lines of the other family
      const ts = [g.t0, g.t1];
      others.forEach(o => { if (o.c > g.t0 - eps && o.c < g.t1 + eps && g.c > o.t0 - eps && g.c < o.t1 + eps) ts.push(o.c); });
      ts.sort((a, b) => a - b);
      for (let k = 0; k < ts.length - 1; k++) {
        if (ts[k + 1] - ts[k] < 1e-6) continue;
        const a = node(...world(g, ts[k])), b = node(...world(g, ts[k + 1]));
        if (a === b) continue;
        adj[a].push(edges.length); adj[b].push(edges.length); edges.push([a, b]);
      }
    };
    segs.h.forEach(g => split(g, segs.v));
    segs.v.forEach(g => split(g, segs.h));

    const used = new Array(edges.length).fill(false);
    const left = n => adj[n].filter(e => !used[e]);
    const other = (e, n) => edges[e][0] === n ? edges[e][1] : edges[e][0];
    const unit = (a, b) => { const dx = pts[b][0] - pts[a][0], dy = pts[b][1] - pts[a][1], l = Math.hypot(dx, dy); return [dx / l, dy / l]; };
    const trails = [];
    let remaining = edges.length, px = penX, py = penY;

    while (remaining > 0) {
      let best = -1, bestKey = null;                    // odd crossings first, then nearest to the pen
      for (let n = 0; n < pts.length; n++) {
        const d = left(n).length;
        if (!d) continue;
        const key = [d % 2 ? 0 : 1, Math.hypot(pts[n][0] - px, pts[n][1] - py)];
        if (!bestKey || key[0] < bestKey[0] || (key[0] === bestKey[0] && key[1] < bestKey[1] - 1e-9)) { best = n; bestKey = key; }
      }
      let cur = best, dir = null;
      const trail = [pts[cur]];
      for (;;) {
        const opts = left(cur);
        if (!opts.length) break;
        const straight = o => { if (!dir) return false; const d = unit(cur, other(o, cur)); return d[0] * dir[0] + d[1] * dir[1] > 1 - 1e-6; };
        const e = opts.find(straight) ?? opts[0];
        const nxt = other(e, cur);
        const d = unit(cur, nxt);
        used[e] = true; remaining--;
        if (dir && d[0] * dir[0] + d[1] * dir[1] > 1 - 1e-6) trail[trail.length - 1] = pts[nxt];   // straight on: extend the last move
        else trail.push(pts[nxt]);
        dir = d; cur = nxt;
      }
      trails.push(trail);
      [px, py] = trail[trail.length - 1];
    }
    return trails;
  }

  // Grid lines through the same points: points_y horizontal lines spanning the width,
  // points_x vertical lines spanning the height. Ported from grid-generator.html.
  function buildLines() {
    const width    = val('width');
    const height   = val('height');
    const nV       = intVal('points_x');
    const nH       = intVal('points_y');
    const startX   = val('origin_x');
    const startY   = val('origin_y');
    const layerH   = val('layer_h');
    const nLayers  = intVal('n_layers');
    const spPrint  = intVal('speed_print');
    const spTravel = intVal('speed_travel');
    const lw       = val('line_width');
    const flow     = val('flow');
    const temp     = intVal('temp');
    const travelZ  = val('travel_z');

    const lenH = width, lenV = height;
    const spH  = nH > 1 ? height / (nH - 1) : 0;       // spacing between horizontal lines (Y)
    const spV  = nV > 1 ? width  / (nV - 1) : 0;       // spacing between vertical lines (X)

    const calcExtrusion = (length, layerH, lineWidth, flow) => {
      const filamentD = 1.75;
      const area = Math.PI * Math.pow(filamentD / 2, 2);
      return (length * layerH * lineWidth * (flow / 100)) / area;
    };

    let E = 0;
    const lines = [];
    const fmt   = v => v.toFixed(4);
    const fmtXY = v => v.toFixed(3);
    const fmtZ  = v => v.toFixed(3);

    lines.push(`;FLAVOR:Marlin`);
    lines.push(`;Generated by Dot / Line Grid (lines mode)`);
    lines.push(`;`);
    lines.push(`;  Horizontal lines : ${nH}  |  Length: ${lenH} mm  |  Spacing Y: ${spH.toFixed(3)} mm`);
    lines.push(`;  Vertical lines   : ${nV}  |  Length: ${lenV} mm  |  Spacing X: ${spV.toFixed(3)} mm`);
    lines.push(`;  Layer height     : ${layerH} mm`);
    lines.push(`;  Num layers       : ${nLayers}  |  Total height: ${(layerH * nLayers).toFixed(3)} mm`);
    lines.push(`;  Travel height    : ${travelZ} mm`);
    lines.push(`;  Line width       : ${lw} mm`);
    lines.push(`;  Flow             : ${flow}%`);
    lines.push(`;  Print speed      : ${spPrint} mm/min`);
    lines.push(`;  Travel speed     : ${spTravel} mm/min`);
    lines.push(``);
    lines.push(`M104 S${temp}`);
    lines.push(`M105`);
    lines.push(`M109 S${temp}`);
    lines.push(`G28`);
    if (!preOn()) lines.push(`G1 Z${fmtZ(travelZ)} F3000`);   // with pre-extrude the first Z move is the raise to "Raise Z to"
    lines.push(`M82`);
    lines.push(`G92 E0`);
    E = preExtrude(lines, spTravel, startX, startY);
    lines.push(``);
    lines.push(`;LAYER_COUNT:${nLayers}`);
    lines.push(`M107`);
    lines.push(``);

    const optimize = optOn();
    const segs = gridSegments(startX, startY, width, height, nH, nV, val('angle'));
    let nStrokes = 0, penX = startX, penY = startY;
    const outline = outOn();
    const outCount = outline ? outlineTrails(segs, startX, startY, width, height, startX, startY).length : 0;
    const emitTrail = (trail, label, liftZ, printZ) => {
      lines.push(`;  ${label}`);
      lines.push(`G0 F${spTravel} Z${fmtZ(liftZ)}`);
      lines.push(`G0 F${spTravel} X${fmtXY(trail[0][0])} Y${fmtXY(trail[0][1])}`);
      lines.push(`G0 F3000 Z${fmtZ(printZ)}`);
      for (let p = 1; p < trail.length; p++) {
        E += calcExtrusion(Math.hypot(trail[p][0] - trail[p - 1][0], trail[p][1] - trail[p - 1][1]), layerH, lw, flow);
        lines.push(`G1 F${spPrint} X${fmtXY(trail[p][0])} Y${fmtXY(trail[p][1])} E${fmt(E)}`);
      }
      nStrokes++;
      [penX, penY] = trail[trail.length - 1];
    };

    for (let layer = 0; layer < nLayers; layer++) {
      const printZ = layerH * (layer + 1);
      const liftZ  = printZ + travelZ;

      lines.push(`;--- LAYER ${layer + 1} / ${nLayers}  (Z=${printZ.toFixed(3)} mm) ---`);
      lines.push(`;LAYER:${layer}`);
      lines.push(``);

      if (optimize) {
        const trails = gridTrails(segs, penX, penY);
        trails.forEach((trail, k) => emitTrail(trail, `Path ${k + 1} / ${trails.length}`, liftZ, printZ));
        lines.push(``);
      } else {
      nStrokes += segs.h.length + segs.v.length;
      [['Horizontal lines', segs.h], ['Vertical lines', segs.v]].forEach(([title, list]) => {
        lines.push(`;  ${title}`);
        list.forEach(g => {
          lines.push(`G0 F${spTravel} Z${fmtZ(liftZ)}`);
          lines.push(`G0 F${spTravel} X${fmtXY(g.x1)} Y${fmtXY(g.y1)}`);
          lines.push(`G0 F3000 Z${fmtZ(printZ)}`);
          E += calcExtrusion(Math.hypot(g.x2 - g.x1, g.y2 - g.y1), layerH, lw, flow);
          lines.push(`G1 F${spPrint} X${fmtXY(g.x2)} Y${fmtXY(g.y2)} E${fmt(E)}`);
        });
        lines.push(``);
      });
      const lastSeg = segs.v[segs.v.length - 1] || segs.h[segs.h.length - 1];
      if (lastSeg) [penX, penY] = [lastSeg.x2, lastSeg.y2];
      }

      if (outline) {
        outlineTrails(segs, startX, startY, width, height, penX, penY).forEach((trail, k, all) => emitTrail(trail, `Outline ${k + 1} / ${all.length}`, liftZ, printZ));
        lines.push(``);
      }
    }

    lines.push(`;--- END ---`);
    lines.push(`G0 F${intVal('final_speed')} Z${fmtZ(val('final_z'))} ; move Z to final height`);
    if (preOn()) lines.push(`G0 F${intVal('pre_travel_speed')} X${val('pre_x').toFixed(3)} Y${val('pre_y').toFixed(3)} ; go to purge position`);
    lines.push(`M82`);
    lines.push(`M104 S0`);
    lines.push(`;End of Gcode`);

    return {
      lines,
      info: [`${nStrokes} strokes${optimize ? ` (was ${(segs.h.length + segs.v.length + outCount) * nLayers})` : ''} · ${nH} horizontal × ${nV} vertical · ${nLayers} layer${nLayers > 1 ? 's' : ''} · ${lines.length} lines`,
             `spacing ${spV.toFixed(2)} × ${spH.toFixed(2)} mm · E total ${E.toFixed(3)}`],
      geom: { kind: 'lines', width, height, ox: startX, oy: startY, px: nV, py: nH, lw, angle: val('angle'), outline: outOn() },
      filename: `grid_${nH}h_${nV}v.gcode`,
    };
  }

  // ── Generate ──────────────────────────────────────────────────
  let filename = 'dot-grid.gcode';

  function setMeta(parts) {
    const meta = $('meta');
    meta.textContent = '';
    parts.forEach(([text, cls]) => {
      const s = document.createElement('span');
      if (cls) s.className = cls;
      s.textContent = text;
      meta.appendChild(s);
    });
  }

  function generate() {
    if (!paramsEl.isConnected) return;             // tool was swapped out
    const error = validate();
    if (error) { setMeta([[error, 'error']]); return; }

    const bed_x = val('bed_x'), bed_y = val('bed_y');
    const out   = mode === 'lines' ? buildLines() : buildDots();
    const g     = out.geom;

    out.lines = applyRetract(out.lines, val('retract'), intVal('retract_speed'));
    document.getElementById('tab-gcode').value = out.lines.join('\n');
    document.getElementById('btn-download').disabled = false;
    $('btn-copy').disabled = false;
    filename = out.filename;

    const meta = out.info.map(t => [t]);
    if (g.ox < 0 || g.oy < 0 || g.ox + g.width > bed_x || g.oy + g.height > bed_y)
      meta.push(['⚠ grid extends beyond the work area', 'warn']);
    const preX = val('pre_x'), preY = val('pre_y');
    if (preOn() && (preX < 0 || preY < 0 || preX > bed_x || preY > bed_y))
      meta.push(['⚠ pre-extrude spot is outside the work area', 'warn']);
    setMeta(meta);

    last = { ...g, bedX: bed_x, bedY: bed_y, preX, preY, preOn: preOn() };
    draw();
    saveParams();
  }

  // ── UI wiring ─────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll('.tool .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    $('tab-preview').classList.toggle('active', name === 'preview');
    $('tab-gcode').classList.toggle('active',   name === 'gcode');
    $('view-seg').classList.toggle('hidden', name !== 'preview');
    if (name === 'preview') draw();
  }
  document.querySelectorAll('.tool .tab-btn').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

  document.querySelectorAll('#view-seg button').forEach(b => b.addEventListener('click', () => {
    view = b.dataset.view;
    document.querySelectorAll('#view-seg button').forEach(x => x.classList.toggle('active', x === b));
    draw();
  }));

  document.querySelectorAll('#mode-seg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode;
    applyMode();
    generate();
  }));

  $('btn-download').addEventListener('click', () => {
    const gcode = $('tab-gcode').value;
    if (!gcode) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([gcode], { type: 'text/plain' }));
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('btn-copy').addEventListener('click', async () => {
    const btn = $('btn-copy');
    try {
      await navigator.clipboard.writeText($('tab-gcode').value);
      btn.textContent = 'Copied';
    } catch {
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
  });

  $('btn-reset').addEventListener('click', () => {
    clearSaved();
    buildParams();
    generate();
  });

  // Settings as a .json file: same shape as what is kept in localStorage.
  $('btn-export').addEventListener('click', () => {
    const o = { tool: 'dot-grid', mode, pre_on: preOn(), optimize: optOn(), outline: outOn() };
    FIELDS.forEach(f => { o[f.id] = val(f.id); });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' }));
    a.download = 'dot-grid-settings.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });
  $('btn-load').addEventListener('click', () => $('settings-file').click());
  $('settings-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    try {
      const o = JSON.parse(await file.text());
      if (!o || typeof o !== 'object' || (o.tool && o.tool !== 'dot-grid')) throw new Error('not a Dot / Line Grid settings file');
      const clean = { mode: o.mode === 'lines' ? 'lines' : 'dots', pre_on: o.pre_on !== false, optimize: o.optimize !== false, outline: o.outline !== false };
      FIELDS.forEach(f => { if (Number.isFinite(o[f.id])) clean[f.id] = o[f.id]; });
      localStorage.setItem(STORE_KEY, JSON.stringify(clean));
      savePurge(clean);
      buildParams();
      generate();
    } catch (err) {
      setMeta([['Could not load settings: ' + err.message, 'error']]);
    }
  });

  paramsEl.addEventListener('click', e => {
    if (e.target.closest('#btn-ghost')) ghostFromCurrent();
    else if (e.target.closest('#btn-ghost-clear')) clearGhosts();
  });
  $('canvas').addEventListener('mousemove', onCanvasMove);
  $('canvas').addEventListener('mouseleave', hideGhostCard);

  new ResizeObserver(draw).observe($('tab-preview'));
  const onResize = () => {
    if (!paramsEl.isConnected) { window.removeEventListener('resize', onResize); return; }
    draw();
  };
  window.addEventListener('resize', onResize);

  buildParams();
  generate();
})();
</script>
