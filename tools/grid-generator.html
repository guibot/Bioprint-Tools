<style>
  .tool { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; min-height: 100%; }

  .tool-params { display: flex; flex-direction: column; gap: 1.5rem; }

  .param-group { display: flex; flex-direction: column; gap: 0.5rem; }

  .param-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text3);
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  .param-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .param-row label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .param-row input {
    width: 90px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; padding: 5px 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text); text-align: right;
    outline: none; transition: border-color 0.15s;
  }
  .param-row input:focus { border-color: var(--accent); }

  .param-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .param-col { display: flex; flex-direction: column; gap: 0.25rem; }
  .param-col label { font-size: 11px; color: var(--text3); }
  .param-col input {
    width: 100%; text-align: center;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; padding: 5px 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text); outline: none; transition: border-color 0.15s;
  }
  .param-col input:focus { border-color: var(--accent); }

  /* output */
  .tool-output { display: flex; flex-direction: column; gap: 0.75rem; }

  .output-actions { display: flex; gap: 0.5rem; align-items: center; }

  .btn-generate {
    background: var(--accent); color: #000;
    border: none; border-radius: 7px;
    padding: 8px 18px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: 'Geist', sans-serif;
    transition: background 0.15s;
  }
  .btn-generate:hover { background: var(--accent-mid); }

  .btn-download {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2); border-radius: 7px;
    padding: 8px 14px; font-size: 13px;
    cursor: pointer; font-family: 'Geist', sans-serif;
    transition: all 0.15s;
  }
  .btn-download:hover { border-color: var(--text3); color: var(--text); }
  .btn-download:disabled { opacity: 0.3; cursor: default; }

  .output-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text3); min-height: 1.2em;
  }

  /* tabs */
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 6px 14px; margin-bottom: -1px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text3); cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .preview-wrap {
    display: none; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .preview-wrap.active { display: block; }
  canvas { width: 100%; display: block; }

  .gcode-output {
    display: none; flex: 1; min-height: 420px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text2); line-height: 1.6;
    resize: none; outline: none; overflow-y: auto;
  }
  .gcode-output.active { display: block; }

  /* legend */
  .legend {
    display: flex; gap: 1rem; padding: 0.5rem 0.75rem;
    border-top: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text3);
  }
  .legend-dot { display: inline-block; width: 10px; height: 2px; border-radius: 1px; margin-right: 4px; vertical-align: middle; }
</style>

<div class="tool">

  <div class="tool-params">

    <div class="param-group">
      <div class="param-group-label">Grid</div>
      <div class="param-row2">
        <div class="param-col"><label>Horiz. lines</label><input id="n_horiz" type="number" value="4" min="1" max="50"></div>
        <div class="param-col"><label>Vert. lines</label> <input id="n_vert"  type="number" value="4" min="1" max="50"></div>
      </div>
      <div class="param-row"><label>Horiz. length (mm)</label> <input id="len_horiz"     type="number" value="60"  step="0.5"></div>
      <div class="param-row"><label>Vert. length (mm)</label>  <input id="len_vert"      type="number" value="60"  step="0.5"></div>
      <div class="param-row"><label>Horiz. spacing (mm)</label><input id="spacing_horiz" type="number" value="15"  step="0.5"></div>
      <div class="param-row"><label>Vert. spacing (mm)</label> <input id="spacing_vert"  type="number" value="15"  step="0.5"></div>
    </div>

    <div class="param-group">
      <div class="param-group-label">Position</div>
      <div class="param-row2">
        <div class="param-col"><label>Start X (mm)</label><input id="start_x" type="number" value="100" step="1"></div>
        <div class="param-col"><label>Start Y (mm)</label><input id="start_y" type="number" value="100" step="1"></div>
      </div>
    </div>

    <div class="param-group">
      <div class="param-group-label">Print</div>
      <div class="param-row2">
        <div class="param-col"><label>Layer height (mm)</label><input id="layer_h"  type="number" value="0.6" step="0.05"></div>
        <div class="param-col"><label>Layers</label>           <input id="n_layers" type="number" value="1"   step="1" min="1"></div>
      </div>
      <div class="param-row"><label>Print speed (mm/min)</label> <input id="speed_print"  type="number" value="600"  step="60"></div>
      <div class="param-row"><label>Travel speed (mm/min)</label><input id="speed_travel" type="number" value="4800" step="60"></div>
      <div class="param-row"><label>Line width (mm)</label>      <input id="line_width"   type="number" value="0.2"  step="0.05"></div>
      <div class="param-row"><label>Flow (%)</label>             <input id="flow"         type="number" value="40"   step="1"></div>
      <div class="param-row"><label>Temperature (°C)</label>     <input id="temp"         type="number" value="280"  step="1"></div>
      <div class="param-row"><label>Travel Z (mm)</label>        <input id="travel_z"     type="number" value="2"    step="0.1"></div>
    </div>

  </div>

  <div class="tool-output">
    <div class="output-actions">
      <button class="btn-generate" onclick="generate()">Generate</button>
      <button class="btn-download" id="btn-download" onclick="download()" disabled>Download .gcode</button>
    </div>
    <div class="output-meta" id="meta"></div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('preview')">Preview</button>
      <button class="tab-btn"        onclick="switchTab('gcode')">G-code</button>
    </div>

    <div class="preview-wrap active" id="tab-preview">
      <canvas id="canvas" height="460"></canvas>
      <div class="legend">
        <span><span class="legend-dot" style="background:#4ade80"></span>horizontal</span>
        <span><span class="legend-dot" style="background:#60a5fa"></span>vertical</span>
      </div>
    </div>
    <textarea class="gcode-output" id="tab-gcode" readonly placeholder="G-code will appear here…"></textarea>
  </div>

</div>

<script>
  function val(id)    { return parseFloat(document.getElementById(id).value); }
  function intVal(id) { return parseInt(document.getElementById(id).value, 10); }

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b, i) =>
      b.classList.toggle('active', ['preview','gcode'][i] === name)
    );
    document.getElementById('tab-preview').classList.toggle('active', name === 'preview');
    document.getElementById('tab-gcode').classList.toggle('active',   name === 'gcode');
  }

  function calcExtrusion(length, layerH, lineWidth, flow) {
    const filamentD = 1.75;
    const area = Math.PI * Math.pow(filamentD / 2, 2);
    return (length * layerH * lineWidth * (flow / 100)) / area;
  }

  function generate() {
    const nH       = intVal('n_horiz');
    const nV       = intVal('n_vert');
    const lenH     = val('len_horiz');
    const lenV     = val('len_vert');
    const spH      = val('spacing_horiz');
    const spV      = val('spacing_vert');
    const startX   = val('start_x');
    const startY   = val('start_y');
    const layerH   = val('layer_h');
    const nLayers  = intVal('n_layers');
    const spPrint  = intVal('speed_print');
    const spTravel = intVal('speed_travel');
    const lw       = val('line_width');
    const flow     = val('flow');
    const temp     = intVal('temp');
    const travelZ  = val('travel_z');

    let E = 0;
    const lines = [];
    const fmt   = v => v.toFixed(4);
    const fmtXY = v => v.toFixed(3);
    const fmtZ  = v => v.toFixed(3);

    lines.push(`;FLAVOR:Marlin`);
    lines.push(`;Generated by Grid Generator`);
    lines.push(`;`);
    lines.push(`;  Horizontal lines : ${nH}  |  Length: ${lenH} mm  |  Spacing Y: ${spH} mm`);
    lines.push(`;  Vertical lines   : ${nV}  |  Length: ${lenV} mm  |  Spacing X: ${spV} mm`);
    lines.push(`;  Layer height     : ${layerH} mm`);
    lines.push(`;  Num layers       : ${nLayers}  |  Total height: ${(layerH * nLayers).toFixed(3)} mm`);
    lines.push(`;  Travel height    : ${travelZ} mm`);
    lines.push(`;  Line width       : ${lw} mm`);
    lines.push(`;  Flow             : ${flow}%`);
    lines.push(`;  Print speed      : ${spPrint} mm/min`);
    lines.push(`;  Travel speed     : ${spTravel} mm/min`);
    lines.push(``);
    lines.push(`M104 S${temp}`);
    lines.push(`M105`);
    lines.push(`M109 S${temp}`);
    lines.push(`G28`);
    lines.push(`G1 Z${fmtZ(travelZ)} F3000`);
    lines.push(`M82`);
    lines.push(`G92 E0`);
    lines.push(``);
    lines.push(`;LAYER_COUNT:${nLayers}`);
    lines.push(`M107`);
    lines.push(``);

    for (let layer = 0; layer < nLayers; layer++) {
      const printZ = layerH * (layer + 1);
      const liftZ  = printZ + travelZ;

      lines.push(`;--- LAYER ${layer + 1} / ${nLayers}  (Z=${printZ.toFixed(3)} mm) ---`);
      lines.push(`;LAYER:${layer}`);
      lines.push(``);
      lines.push(`;  Horizontal lines`);

      for (let i = 0; i < nH; i++) {
        const y  = startY + i * spH;
        const x0 = startX;
        const x1 = startX + lenH;
        lines.push(`G0 F${spTravel} Z${fmtZ(liftZ)}`);
        lines.push(`G0 F${spTravel} X${fmtXY(x0)} Y${fmtXY(y)}`);
        lines.push(`G0 F3000 Z${fmtZ(printZ)}`);
        E += calcExtrusion(lenH, layerH, lw, flow);
        lines.push(`G1 F${spPrint} X${fmtXY(x1)} Y${fmtXY(y)} E${fmt(E)}`);
      }

      lines.push(``);
      lines.push(`;  Vertical lines`);

      for (let j = 0; j < nV; j++) {
        const x  = startX + j * spV;
        const y0 = startY;
        const y1 = startY + lenV;
        lines.push(`G0 F${spTravel} Z${fmtZ(liftZ)}`);
        lines.push(`G0 F${spTravel} X${fmtXY(x)} Y${fmtXY(y0)}`);
        lines.push(`G0 F3000 Z${fmtZ(printZ)}`);
        E += calcExtrusion(lenV, layerH, lw, flow);
        lines.push(`G1 F${spPrint} X${fmtXY(x)} Y${fmtXY(y1)} E${fmt(E)}`);
      }

      lines.push(``);
    }

    const finalZ = layerH * nLayers + travelZ;
    lines.push(`;--- END ---`);
    lines.push(`G0 F3000 Z${fmtZ(finalZ)}`);
    lines.push(`M82`);
    lines.push(`M104 S0`);
    lines.push(`;End of Gcode`);

    document.getElementById('tab-gcode').value = lines.join('\n');
    document.getElementById('btn-download').disabled = false;

    const gridW    = Math.max((nV - 1) * spV, lenH).toFixed(1);
    const gridH    = Math.max((nH - 1) * spH, lenV).toFixed(1);
    const totalH   = (layerH * nLayers).toFixed(2);
    document.getElementById('meta').textContent =
      `${(nH + nV) * nLayers} lines · ${gridW} × ${gridH} × ${totalH} mm · E total: ${E.toFixed(3)} mm`;

    drawPreview(nH, nV, lenH, lenV, spH, spV, startX, startY);
    switchTab('preview');
  }

  function drawPreview(nH, nV, lenH, lenV, spH, spV, startX, startY) {
    const canvas = document.getElementById('canvas');
    const W = canvas.offsetWidth || 480;
    const H = canvas.height;
    canvas.width = W;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#0d0e10';
    ctx.fillRect(0, 0, W, H);

    const maxX = Math.max(startX + lenH, startX + (nV - 1) * spV);
    const maxY = Math.max(startY + lenV, startY + (nH - 1) * spH);
    const bbW  = maxX - startX || 1;
    const bbH  = maxY - startY || 1;
    const pad  = 40;
    const scale = Math.min((W - pad * 2) / bbW, (H - pad * 2) / bbH);
    const offX  = (W - bbW * scale) / 2;
    const offY  = (H - bbH * scale) / 2;

    const toC = (x, y) => [offX + (x - startX) * scale, offY + (y - startY) * scale];

    // horizontal lines (green)
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#4ade80';
    ctx.shadowBlur = 5;
    for (let i = 0; i < nH; i++) {
      const y = startY + i * spH;
      const [x0, y0] = toC(startX, y);
      const [x1, y1] = toC(startX + lenH, y);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }

    // vertical lines (blue)
    ctx.strokeStyle = '#60a5fa';
    ctx.shadowColor = '#60a5fa';
    for (let j = 0; j < nV; j++) {
      const x = startX + j * spV;
      const [x0, y0] = toC(x, startY);
      const [x1, y1] = toC(x, startY + lenV);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }

    // intersection dots
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    for (let i = 0; i < nH; i++) {
      for (let j = 0; j < nV; j++) {
        const [cx, cy] = toC(startX + j * spV, startY + i * spH);
        ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // dimension labels
    ctx.fillStyle = '#6b7280';
    ctx.font = '10px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${bbW.toFixed(1)} mm`, W / 2, H - 6);
    ctx.save();
    ctx.translate(12, H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(`${bbH.toFixed(1)} mm`, 0, 0);
    ctx.restore();
  }

  function download() {
    const gcode = document.getElementById('tab-gcode').value;
    if (!gcode) return;
    const nH = document.getElementById('n_horiz').value;
    const nV = document.getElementById('n_vert').value;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([gcode], { type: 'text/plain' }));
    a.download = `grid_${nH}h_${nV}v.gcode`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // redraw on resize
  window.addEventListener('resize', () => {
    if (!document.getElementById('btn-download').disabled) {
      drawPreview(intVal('n_horiz'), intVal('n_vert'),
        val('len_horiz'), val('len_vert'),
        val('spacing_horiz'), val('spacing_vert'),
        val('start_x'), val('start_y'));
    }
  });
</script>
