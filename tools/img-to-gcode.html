<style>
  .tool { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; min-height: 100%; }

  .tool-params { display: flex; flex-direction: column; gap: 1.5rem; }

  .param-group { display: flex; flex-direction: column; gap: 0.5rem; }

  .param-group-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text3);
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }

  .param-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .param-row label { font-size: 13px; color: var(--text2); white-space: nowrap; }
  .param-row input,
  .param-row select {
    width: 90px;
    background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 6px; padding: 5px 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text); text-align: right;
    outline: none; transition: border-color 0.15s;
  }
  .param-row select { text-align: left; cursor: pointer; }
  .param-row input:focus,
  .param-row select:focus { border-color: var(--accent); }

  .drop-zone {
    border: 1px dashed var(--border2); border-radius: 8px;
    padding: 1.2rem 1rem; text-align: center;
    cursor: pointer; transition: border-color 0.15s, background 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 0.4rem;
  }
  .drop-zone:hover,
  .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); }
  .drop-zone .dz-label { font-size: 12px; color: var(--text2); }
  .drop-zone .dz-file  { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); }
  #file-input { display: none; }

  .tool-output { display: flex; flex-direction: column; gap: 0.75rem; }

  .output-actions { display: flex; gap: 0.5rem; align-items: center; }

  .btn-generate {
    background: var(--accent); color: #000;
    border: none; border-radius: 7px;
    padding: 8px 18px; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: 'Geist', sans-serif;
    transition: background 0.15s;
  }
  .btn-generate:hover { background: var(--accent-mid); }
  .btn-generate:disabled { opacity: 0.35; cursor: default; }

  .btn-download {
    background: transparent; color: var(--text2);
    border: 1px solid var(--border2); border-radius: 7px;
    padding: 8px 14px; font-size: 13px;
    cursor: pointer; font-family: 'Geist', sans-serif;
    transition: all 0.15s;
  }
  .btn-download:hover { border-color: var(--text3); color: var(--text); }
  .btn-download:disabled { opacity: 0.3; cursor: default; }

  .output-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text3); min-height: 1.2em;
  }

  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
  .tab-btn {
    background: none; border: none; border-bottom: 2px solid transparent;
    padding: 6px 14px; margin-bottom: -1px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text3); cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  .preview-wrap {
    display: none; flex-direction: column; align-items: center;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem;
  }
  .preview-wrap.active { display: flex; }
  canvas { border-radius: 4px; max-width: 100%; }

  .gcode-output {
    display: none; flex: 1; min-height: 420px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text2); line-height: 1.6;
    resize: none; outline: none; overflow-y: auto;
  }
  .gcode-output.active { display: block; }
</style>

<div class="tool">

  <div class="tool-params">

    <div class="param-group">
      <div class="param-group-label">Image</div>
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <span class="dz-label">Click or drag an image</span>
        <span class="dz-file" id="file-name">no file selected</span>
      </div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="param-group">
      <div class="param-group-label">Mode</div>
      <div class="param-row">
        <label>Print mode</label>
        <select id="mode" onchange="onModeChange()">
          <option value="dots">dots</option>
          <option value="crosshatch">crosshatch</option>
          <option value="spiral">spiral</option>
        </select>
      </div>
    </div>

    <div class="param-group">
      <div class="param-group-label">Grid</div>
      <div class="param-row"><label>Width (mm)</label>   <input id="width"    type="number" value="100" step="1"></div>
      <div class="param-row"><label>Height (mm)</label>  <input id="height"   type="number" value="100" step="1"></div>
      <div class="param-row"><label>Points X</label>     <input id="points_x" type="number" value="10"  step="1" min="2"></div>
      <div class="param-row"><label>Points Y</label>     <input id="points_y" type="number" value="10"  step="1" min="2"></div>
    </div>

    <div class="param-group">
      <div class="param-group-label">Position</div>
      <div class="param-row"><label>Origin X (mm)</label> <input id="origin_x" type="number" value="0" step="1"></div>
      <div class="param-row"><label>Origin Y (mm)</label> <input id="origin_y" type="number" value="0" step="1"></div>
    </div>

    <div class="param-group">
      <div class="param-group-label">Print</div>
      <div class="param-row"><label>Print height (mm)</label>  <input id="print_height" type="number" value="0.2"  step="0.05"></div>
      <div class="param-row"><label>Z hop (mm)</label>         <input id="z_hop"        type="number" value="2.0"  step="0.5"></div>
      <div class="param-row"><label>Flow rate (mm³)</label>    <input id="flow_rate"    type="number" value="0.05" step="0.001"></div>
      <div class="param-row" id="pause-row"><label>Pause (ms)</label> <input id="pause_ms" type="number" value="100" step="50"></div>
    </div>

    <div class="param-group" id="spiral-group" style="display:none">
      <div class="param-group-label">Spiral</div>
      <div class="param-row"><label>Turns</label>          <input id="spiral_turns" type="number" value="15"  step="1"  min="1"></div>
      <div class="param-row"><label>Steps per turn</label> <input id="spiral_steps" type="number" value="120" step="10" min="10"></div>
    </div>

  </div>

  <div class="tool-output">
    <div class="output-actions">
      <button class="btn-generate" id="btn-generate" onclick="generate()" disabled>Generate</button>
      <button class="btn-download" id="btn-download" onclick="download()" disabled>Download .gcode</button>
    </div>
    <div class="output-meta" id="meta"></div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('preview')">Preview</button>
      <button class="tab-btn"        onclick="switchTab('gcode')">G-code</button>
    </div>

    <div class="preview-wrap active" id="tab-preview">
      <canvas id="canvas" width="480" height="480"></canvas>
    </div>
    <textarea class="gcode-output" id="tab-gcode" readonly placeholder="G-code will appear here…"></textarea>
  </div>

</div>

<script>
  let loadedImageSrc = null;

  function val(id)    { return parseFloat(document.getElementById(id).value); }
  function intVal(id) { return parseInt(document.getElementById(id).value, 10); }

  // ── FILE HANDLING ────────────────────────────────────────────────────────────

  function onFileLoaded(file) {
    const reader = new FileReader();
    reader.onload = e => {
      loadedImageSrc = e.target.result;
      document.getElementById('file-name').textContent = file.name;
      document.getElementById('btn-generate').disabled = false;
      document.getElementById('meta').textContent = '';
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files[0]) onFileLoaded(e.target.files[0]);
  });

  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) onFileLoaded(file);
  });

  // ── MODE TOGGLE ──────────────────────────────────────────────────────────────

  function onModeChange() {
    const mode = document.getElementById('mode').value;
    document.getElementById('spiral-group').style.display = mode === 'spiral' ? '' : 'none';
    document.getElementById('pause-row').style.display    = mode === 'dots'   ? '' : 'none';
  }

  // ── IMAGE PROCESSING ─────────────────────────────────────────────────────────
  // Replicates: grayscale → invert → threshold at 127 → resize (NEAREST) → flip vertical

  function processImage(src, nx, ny) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const offscreen = document.createElement('canvas');
        offscreen.width = nx;
        offscreen.height = ny;
        const ctx = offscreen.getContext('2d');
        ctx.drawImage(img, 0, 0, nx, ny);
        const data = ctx.getImageData(0, 0, nx, ny).data;

        const pixels = [];
        for (let j = 0; j < ny; j++) {
          pixels[j] = [];
          for (let i = 0; i < nx; i++) {
            const o = (j * nx + i) * 4;
            const gray = 0.299 * data[o] + 0.587 * data[o+1] + 0.114 * data[o+2];
            pixels[j][i] = (255 - gray) > 127 ? 255 : 0;
          }
        }
        pixels.reverse();  // flip vertical (PIL FLIP_TOP_BOTTOM)
        resolve(pixels);
      };
      img.src = src;
    });
  }

  // ── G-CODE GENERATORS ────────────────────────────────────────────────────────

  function gcodeDotsBody(pixels, nx, ny, ox, oy, w, h, zh, zp, fr, pauseMs) {
    const sx = w / (nx - 1);
    const sy = h / (ny - 1);
    let E = 0;
    const lines = [];
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        if (pixels[j][i] > 0) {
          const x = (ox + i * sx).toFixed(3);
          const y = (oy + j * sy).toFixed(3);
          E += fr;
          lines.push(
            `; Dot at (${i},${j})`,
            `G1 Z${zh.toFixed(2)} F1000`,
            `G1 X${x} Y${y} F1000`,
            `G1 Z${zp.toFixed(2)} F1000`,
            `G1 E${E.toFixed(5)} F20`,
            `G4 P${pauseMs}`,
            `G1 Z${zh.toFixed(2)} F1000`
          );
        }
      }
    }
    return lines;
  }

  function gcodeCrosshatchBody(pixels, nx, ny, ox, oy, w, h, zh, zp, fr) {
    const sx = w / (nx - 1);
    const sy = h / (ny - 1);
    let E = 0;
    const lines = [];

    for (let j = 0; j < ny; j++) {
      const row = j % 2 === 0
        ? Array.from({length: nx}, (_, k) => k)
        : Array.from({length: nx}, (_, k) => nx - 1 - k);
      const y = (oy + j * sy).toFixed(3);
      let prev = false;
      for (const i of row) {
        const x = (ox + i * sx).toFixed(3);
        if (pixels[j][i] > 0) {
          if (!prev) {
            lines.push(`G1 Z${zh.toFixed(2)} F1000`, `G1 X${x} Y${y} F3000`, `G1 Z${zp.toFixed(2)} F1000`);
          } else {
            E += fr;
            lines.push(`G1 X${x} Y${y} E${E.toFixed(5)} F300`);
          }
          prev = true;
        } else {
          if (prev) lines.push(`G1 Z${zh.toFixed(2)} F1000`);
          prev = false;
        }
      }
      if (prev) lines.push(`G1 Z${zh.toFixed(2)} F1000`);
    }

    for (let i = 0; i < nx; i++) {
      const col = i % 2 === 0
        ? Array.from({length: ny}, (_, k) => k)
        : Array.from({length: ny}, (_, k) => ny - 1 - k);
      const x = (ox + i * sx).toFixed(3);
      let prev = false;
      for (const j of col) {
        const y = (oy + j * sy).toFixed(3);
        if (pixels[j][i] > 0) {
          if (!prev) {
            lines.push(`G1 Z${zh.toFixed(2)} F1000`, `G1 X${x} Y${y} F3000`, `G1 Z${zp.toFixed(2)} F1000`);
          } else {
            E += fr;
            lines.push(`G1 X${x} Y${y} E${E.toFixed(5)} F300`);
          }
          prev = true;
        } else {
          if (prev) lines.push(`G1 Z${zh.toFixed(2)} F1000`);
          prev = false;
        }
      }
      if (prev) lines.push(`G1 Z${zh.toFixed(2)} F1000`);
    }

    return lines;
  }

  function gcodeSpiralBody(pixels, nx, ny, ox, oy, w, h, zh, zp, fr, turns, steps) {
    const cx = ox + w / 2;
    const cy = oy + h / 2;
    const maxR = Math.min(w, h) / 2;
    const totalSteps = turns * steps;
    let E = 0;
    const lines = [];
    let prev = false;

    for (let step = 0; step <= totalSteps; step++) {
      const t     = step / totalSteps;
      const angle = t * turns * 2 * Math.PI;
      const r     = t * maxR;
      const x     = cx + r * Math.cos(angle);
      const y     = cy + r * Math.sin(angle);

      const xn = Math.min(1, Math.max(0, (x - ox) / w));
      const yn = Math.min(1, Math.max(0, (y - oy) / h));
      const pi = Math.min(nx - 1, Math.floor(xn * (nx - 1)));
      const pj = Math.min(ny - 1, Math.floor(yn * (ny - 1)));
      const intensity = pixels[pj][pi];
      const active    = intensity > 0;

      if (active) {
        if (!prev) {
          lines.push(`G1 Z${zh.toFixed(2)} F1000`, `G1 X${x.toFixed(3)} Y${y.toFixed(3)} F3000`, `G1 Z${zp.toFixed(2)} F1000`);
        } else {
          E += fr * (intensity / 255);
          lines.push(`G1 X${x.toFixed(3)} Y${y.toFixed(3)} E${E.toFixed(5)} F500`);
        }
      } else {
        if (prev) lines.push(`G1 Z${zh.toFixed(2)} F1000`);
      }
      prev = active;
    }
    if (prev) lines.push(`G1 Z${zh.toFixed(2)} F1000`);
    return lines;
  }

  // ── PREVIEW DRAWERS ──────────────────────────────────────────────────────────

  function drawDotsPreview(pixels, nx, ny) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, pad = 24;
    const cw = (W - pad * 2) / (nx - 1 || 1);
    const ch = (H - pad * 2) / (ny - 1 || 1);

    ctx.fillStyle = '#0d0e10';
    ctx.fillRect(0, 0, W, H);

    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const cx = pad + i * cw;
        const cy = H - pad - j * ch;
        if (pixels[j][i] > 0) {
          ctx.beginPath();
          ctx.arc(cx, cy, 5, 0, Math.PI * 2);
          ctx.fillStyle = '#4ade80';
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(cx, cy, 2, 0, Math.PI * 2);
          ctx.fillStyle = '#2a2a3a';
          ctx.fill();
        }
      }
    }
  }

  function drawCrosshatchPreview(pixels, nx, ny) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, pad = 24;
    const cw = (W - pad * 2) / (nx - 1 || 1);
    const ch = (H - pad * 2) / (ny - 1 || 1);
    const toC = (i, j) => [pad + i * cw, H - pad - j * ch];

    ctx.fillStyle = '#0d0e10';
    ctx.fillRect(0, 0, W, H);
    ctx.lineWidth = 1;

    ctx.strokeStyle = '#4ade80';
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx - 1; i++) {
        if (pixels[j][i] > 0 && pixels[j][i+1] > 0) {
          const [x0, y0] = toC(i, j), [x1, y1] = toC(i+1, j);
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }
      }
    }
    ctx.strokeStyle = '#60a5fa';
    for (let i = 0; i < nx; i++) {
      for (let j = 0; j < ny - 1; j++) {
        if (pixels[j][i] > 0 && pixels[j+1][i] > 0) {
          const [x0, y0] = toC(i, j), [x1, y1] = toC(i, j+1);
          ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        }
      }
    }
  }

  function drawSpiralPreview(pixels, nx, ny, ox, oy, w, h, turns, steps) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, pad = 24;

    ctx.fillStyle = '#0d0e10';
    ctx.fillRect(0, 0, W, H);

    const cxP = ox + w / 2, cyP = oy + h / 2, maxR = Math.min(w, h) / 2;
    const totalSteps = turns * steps;
    const toC = (x, y) => [
      pad + ((x - ox) / w) * (W - pad * 2),
      H - pad - ((y - oy) / h) * (H - pad * 2),
    ];

    ctx.lineWidth = 1;
    let prevCx = null, prevCy = null;

    for (let step = 0; step <= totalSteps; step++) {
      const t     = step / totalSteps;
      const angle = t * turns * 2 * Math.PI;
      const r     = t * maxR;
      const x     = cxP + r * Math.cos(angle);
      const y     = cyP + r * Math.sin(angle);

      const xn = Math.min(1, Math.max(0, (x - ox) / w));
      const yn = Math.min(1, Math.max(0, (y - oy) / h));
      const pi = Math.min(nx - 1, Math.floor(xn * (nx - 1)));
      const pj = Math.min(ny - 1, Math.floor(yn * (ny - 1)));
      const active = pixels[pj][pi] > 0;

      const [cx, cy] = toC(x, y);
      if (prevCx !== null) {
        ctx.beginPath();
        ctx.moveTo(prevCx, prevCy);
        ctx.lineTo(cx, cy);
        ctx.strokeStyle = active ? 'rgba(74,222,128,0.75)' : 'rgba(74,222,128,0.07)';
        ctx.stroke();
      }
      prevCx = cx; prevCy = cy;
    }
  }

  // ── TABS ─────────────────────────────────────────────────────────────────────

  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach((b, i) =>
      b.classList.toggle('active', ['preview','gcode'][i] === name)
    );
    document.getElementById('tab-preview').classList.toggle('active', name === 'preview');
    document.getElementById('tab-gcode').classList.toggle('active',   name === 'gcode');
  }

  // ── MAIN ─────────────────────────────────────────────────────────────────────

  async function generate() {
    if (!loadedImageSrc) return;

    const nx      = intVal('points_x');
    const ny      = intVal('points_y');
    const w       = val('width');
    const h       = val('height');
    const ox      = val('origin_x');
    const oy      = val('origin_y');
    const zh      = val('z_hop');
    const zp      = val('print_height');
    const fr      = val('flow_rate');
    const pauseMs = intVal('pause_ms');
    const mode    = document.getElementById('mode').value;
    const turns   = intVal('spiral_turns');
    const steps   = intVal('spiral_steps');

    const btn = document.getElementById('btn-generate');
    btn.disabled = true;
    btn.textContent = 'Processing…';
    document.getElementById('meta').textContent = '';

    const pixels = await processImage(loadedImageSrc, nx, ny);

    let bodyLines;
    if (mode === 'crosshatch') {
      bodyLines = gcodeCrosshatchBody(pixels, nx, ny, ox, oy, w, h, zh, zp, fr);
      drawCrosshatchPreview(pixels, nx, ny);
    } else if (mode === 'spiral') {
      bodyLines = gcodeSpiralBody(pixels, nx, ny, ox, oy, w, h, zh, zp, fr, turns, steps);
      drawSpiralPreview(pixels, nx, ny, ox, oy, w, h, turns, steps);
    } else {
      bodyLines = gcodeDotsBody(pixels, nx, ny, ox, oy, w, h, zh, zp, fr, pauseMs);
      drawDotsPreview(pixels, nx, ny);
    }

    const header = [
      `; Mode: ${mode}`,
      '; Generated G-code from image',
      'G90 ; absolute positioning',
      'M82 ; absolute extrusion mode',
      'G21 ; use mm',
      'G28 ; home all axes',
      'T0 ; select tool 0',
      `G1 Z${zh.toFixed(2)} F1000`,
    ];
    const footer = [
      '; End of print',
      `G1 Z${(zh + 5).toFixed(2)} F1000`,
      'M104 S0',
      'M140 S0',
      'M84',
    ];

    const gcode = [...header, ...bodyLines, ...footer].join('\n');
    document.getElementById('tab-gcode').value = gcode;
    document.getElementById('btn-download').disabled = false;

    const activeCount = pixels.flat().filter(p => p > 0).length;
    document.getElementById('meta').textContent =
      `${activeCount} active pixels · ${nx}×${ny} grid · ${bodyLines.length} G-code lines`;

    btn.disabled = false;
    btn.textContent = 'Generate';
    switchTab('preview');
  }

  function download() {
    const gcode = document.getElementById('tab-gcode').value;
    if (!gcode) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([gcode], { type: 'text/plain' }));
    a.download = 'img-to-gcode.gcode';
    a.click();
    URL.revokeObjectURL(a.href);
  }
</script>
